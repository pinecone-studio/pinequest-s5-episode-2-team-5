<title>ChemQuest Хими 8 Хаб</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed topic rail (left) + reading column; rail becomes a drawer under 900px. Lab-notebook paper, copper-sulfate blue ink, Bunsen-flame orange for exam tips. */
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --sunk:#EEF2F4; --ink:#14212B; --ink-2:#4B5B67; --ink-3:#7A8994; --line:#DCE3E8;
  --accent:#136F9E; --accent-ink:#0B4F73; --accent-soft:#E2EFF6; --on-accent:#FFFFFF;
  --flame:#B9531B; --flame-soft:#FBECE1;
  --good:#1D7448; --good-soft:#E1F2E8; --bad:#AE2A21; --bad-soft:#FAE5E3; --amber:#8A6100; --amber-soft:#FFF2CC;
  --k-metal:#DCEBF5; --k-non:#FCEFD3; --k-noble:#E2F1E6;
  --c-am:#F7D6CF; --c-ae:#FBE4C4; --c-tm:#E1E7F2; --c-pt:#D8EEE6; --c-md:#E8E0F4; --c-nm:#FFF0BE; --c-hl:#D3EEF2; --c-ng:#DCEFDF; --c-ln:#F4DDEC; --c-an:#EEDCE3;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 4px 16px rgba(20,33,43,.06);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --rail:288px; --top:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151A; --surface:#152028; --sunk:#111B22; --ink:#E5ECF0; --ink-2:#A2B2BD; --ink-3:#74858F; --line:#25333D;
  --accent:#5AB2DF; --accent-ink:#9CD2EE; --accent-soft:#163042; --on-accent:#08202D;
  --flame:#F08C4E; --flame-soft:#38231A;
  --good:#4FC28A; --good-soft:#13301F; --bad:#F27A70; --bad-soft:#3A1B19; --amber:#E7B94C; --amber-soft:#33290F;
  --k-metal:#1A3446; --k-non:#3A2F14; --k-noble:#173322;
  --c-am:#4A2620; --c-ae:#45341A; --c-tm:#23304A; --c-pt:#1B3A31; --c-md:#33284A; --c-nm:#3D3412; --c-hl:#153B41; --c-ng:#183A25; --c-ln:#432238; --c-an:#3A2430;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#152028; --sunk:#111B22; --ink:#E5ECF0; --ink-2:#A2B2BD; --ink-3:#74858F; --line:#25333D;
  --accent:#5AB2DF; --accent-ink:#9CD2EE; --accent-soft:#163042; --on-accent:#08202D;
  --flame:#F08C4E; --flame-soft:#38231A;
  --good:#4FC28A; --good-soft:#13301F; --bad:#F27A70; --bad-soft:#3A1B19; --amber:#E7B94C; --amber-soft:#33290F;
  --k-metal:#1A3446; --k-non:#3A2F14; --k-noble:#173322;
  --c-am:#4A2620; --c-ae:#45341A; --c-tm:#23304A; --c-pt:#1B3A31; --c-md:#33284A; --c-nm:#3D3412; --c-hl:#153B41; --c-ng:#183A25; --c-ln:#432238; --c-an:#3A2430;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:650;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.2rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
sub,sup{font-size:.72em;line-height:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;border:0;background:none;padding:0}
.brand .flask{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:.72rem;line-height:1}
.search{flex:1;max-width:460px;margin-left:auto;position:relative;min-width:0}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:0 14px 0 36px}
.search svg{position:absolute;left:12px;top:11px;color:var(--ink-3)}
.xp{font-family:var(--f-mono);font-size:.85rem;background:var(--amber-soft);color:var(--amber);padding:4px 10px;border-radius:999px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.menu-btn{display:grid}
.focus-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;padding:0 12px;font-size:.88rem;font-weight:500;flex:none}
.focus-btn .on-txt{display:none}
body.focus .focus-btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body.focus .focus-btn .on-txt{display:inline} body.focus .focus-btn .off-txt{display:none}
@media (min-width:901px){ body.rail-off .shell{grid-template-columns:minmax(0,1fr)} body.rail-off .rail{display:none} }
body.focus .shell{grid-template-columns:minmax(0,1fr)}
body.focus .rail, body.focus .scrim, body.focus .search, body.focus .xp, body.focus .menu-btn, body.focus .crumbs, body.focus .prog-line, body.focus .toc, body.focus .demo-flag{display:none!important}
body.focus .notes-layout{grid-template-columns:minmax(0,1fr)}
body.focus .wrap{max-width:740px}
body.focus .focus-btn{margin-left:auto}
.prog-line{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--ink-2)}
.prog-line .bar{width:140px}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100% - var(--top))}
.rail{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow:auto;padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px))}
.rail .grp{margin:14px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--ink-2);font-size:.93rem}
.nav-item:hover{background:var(--sunk);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .num{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3);min-width:26px}
.nav-item.on .num{color:var(--accent-ink)}
.nav-item .pct{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.ch-head{display:flex;gap:8px;align-items:baseline;padding:10px 10px 4px;font-weight:600;font-size:.86rem}
.ch-head .rn{font-family:var(--f-display);color:var(--flame);min-width:26px}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(320px,86vw);z-index:25;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.3)}
  .brand small{display:none}
}
@media (max-width:560px){.xp{display:none}.brand .t{display:none}}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:.93rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;background:var(--surface);color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lvl-easy{color:var(--good)} .lvl-medium{color:var(--amber)} .lvl-hard{color:var(--bad)}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}
.demo-flag{font-size:.78rem;color:var(--ink-3);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hero .lead{display:flex;flex-direction:column;gap:12px;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.25rem}
.stat span{font-size:.78rem;color:var(--ink-2)}
.chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chcard{display:flex;flex-direction:column;gap:10px}
.chcard .rn{font-family:var(--f-display);font-size:1.5rem;color:var(--flame);line-height:1}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) 80px;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:8px 6px;border-radius:8px;width:100%}
.trow:hover{background:var(--sunk)}
.trow .n{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-3)}
@media (max-width:760px){.hero,.chgrid{grid-template-columns:minmax(0,1fr)}}

/* topic */
.crumbs{font-size:.85rem;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--ink-2);white-space:nowrap;font-weight:500}
.tab.on{color:var(--accent-ink);border-color:var(--accent)}
.tab .c{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3);margin-left:4px}
.prog4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.prog4 .k{font-size:.76rem;color:var(--ink-2);display:flex;justify-content:space-between}
@media (max-width:560px){.prog4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.notes-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(var(--top) + 20px);display:flex;flex-direction:column;gap:2px}
.toc button{text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--ink-2);font-size:.88rem;display:flex;gap:8px}
.toc button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc .tick{color:var(--good);margin-left:auto}
@media (max-width:760px){.notes-layout{grid-template-columns:minmax(0,1fr)}.toc{position:static;flex-direction:row;overflow-x:auto}.toc button{white-space:nowrap}}
.note{display:flex;flex-direction:column;gap:16px;max-width:70ch}
.note p{margin:0}
.note ul,.note ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th{background:var(--sunk);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.box{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.box .lbl{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.box.key{background:var(--accent-soft)} .box.key .lbl{color:var(--accent-ink)}
.box.tip{background:var(--flame-soft)} .box.tip .lbl{color:var(--flame)}
.box.warn{background:var(--bad-soft)} .box.warn .lbl{color:var(--bad)}
.box.fact{background:var(--sunk)} .box.fact .lbl{color:var(--ink-2)}
.box.errata{background:var(--amber-soft);border:1px dashed var(--amber)} .box.errata .lbl{color:var(--amber)}
.eq{font-family:var(--f-mono);font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;border-radius:6px;overflow-x:auto}
.ex{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex .q{padding:12px 14px;background:var(--sunk)}
.ex .a{padding:12px 14px;border-top:1px solid var(--line)}
.ex .a[hidden]{display:none}
.fig{margin:0;display:flex;flex-direction:column;gap:8px}
.fig figcaption{font-size:.84rem;color:var(--ink-3)}
.fig .canvas{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.nuc{display:inline-flex;align-items:center;gap:1px;vertical-align:middle}
.nuc .st{display:inline-flex;flex-direction:column;font-size:.66em;line-height:1.05;text-align:right}
.read-btn{align-self:flex-start}

/* flashcards */
.fc-stage{display:flex;flex-direction:column;gap:14px;align-items:center}
.fc{width:min(560px,100%);aspect-ratio:16/10;max-width:100%;perspective:1200px;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;gap:10px;font-size:1.12rem}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.fc-face .eyebrow{position:absolute;top:14px;left:18px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(560px,100%)}
.rate .btn{padding:10px 6px}
.rate .r0{border-color:var(--bad);color:var(--bad)} .rate .r1{border-color:var(--amber);color:var(--amber)} .rate .r2{border-color:var(--good);color:var(--good)}
.boxes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fc-nav{display:flex;align-items:center;gap:8px;width:min(560px,100%);flex-wrap:wrap}
.fc-nav .cnt{font-family:var(--f-mono);font-size:.9rem;min-width:64px;text-align:center}
.fc-nav .sp{flex:1}
.fc-list{width:min(560px,100%);border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:320px;overflow:auto;display:flex;flex-direction:column}
.fc-list button{display:grid;grid-template-columns:28px 10px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;font-size:.88rem}
.fc-list button:last-child{border-bottom:0}
.fc-list button:hover{background:var(--sunk)}
.fc-list button.cur{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.fc-list .n{font-family:var(--f-mono);color:var(--ink-3);font-size:.78rem}
.fc-list .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.b1{background:var(--amber)} .dot.b2,.dot.b3{background:var(--good)} .dot.b0s{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}

/* quiz */
.qopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px}
.qopt .L{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);min-width:18px}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt:disabled{cursor:default}
.feedback{border-radius:8px;padding:12px 14px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.score-big{font-family:var(--f-display);font-size:2.6rem;line-height:1}

/* structured questions */
.sq{display:flex;flex-direction:column;gap:14px}
.sq .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.part{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.part .pp{display:flex;gap:10px}
.part .pl{font-weight:700;min-width:22px}
.part .mk{margin-left:auto;font-family:var(--f-mono);font-size:.82rem;color:var(--ink-3);white-space:nowrap}
.part textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);resize:vertical}
.scheme{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.scheme label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.scheme input{margin-top:5px;accent-color:var(--good)}
.model{font-size:.92rem;border-left:3px solid var(--good);padding-left:10px}

/* periodic table */
.pt{display:grid;grid-template-columns:repeat(8,minmax(32px,1fr));gap:3px;min-width:280px}
.el{border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;background:var(--k-metal);line-height:1.1}
.el.n{background:var(--k-non)} .el.g{background:var(--k-noble)}
.el b{display:block;font-size:1rem}
.el small{font-family:var(--f-mono);font-size:.62rem;color:var(--ink-2)}
.el.on{outline:2px solid var(--accent);outline-offset:1px}
.el.empty{visibility:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:center}
@media (max-width:640px){.split{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-family:var(--f-mono)}

/* full periodic table */
.ptf-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px}
.ptf{display:grid;grid-template-columns:22px repeat(18,minmax(46px,1fr));gap:3px;min-width:900px}
.ptf .gh{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3);text-align:center;line-height:1.15;padding-bottom:2px}
.ptf .ph{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);display:grid;place-items:center}
.ptf .e{border:1px solid var(--line);border-radius:5px;padding:3px 3px 2px;text-align:left;line-height:1.05;min-height:58px;display:flex;flex-direction:column;gap:1px;overflow:hidden;color:var(--ink);transition:opacity .15s}
.ptf .e .zz{font-family:var(--f-mono);font-size:.6rem;color:var(--ink-2)}

вчлалтай шилжүүлдэг."},{"id":"1.1-mcq2","question":"Хэмжээст цилиндрийн заалтыг хэрхэн зөв унших вэ?","options":["Менискийн дээд хэсгээр, дээрээс харж","Менискийн доод хэсгээр, нүдний түвшинд","Савны ханан дахь шингэний түвшнээр","Менискийн дунд хэсгээр, доороос харж"],"answer":1,"explanation":"Нүдээ менискийн түвшинд байлгаж, доод цэгийг уншина. Дээрээс харвал илүү их утга уншигдана."},{"id":"1.1-mcq3","question":"250 мл хэдэн см³ вэ?","options":["2.5 см³","25 см³","250 см³","2500 см³"],"answer":2,"explanation":"1 мл = 1 см³ тул 250 мл = 250 см³."},{"id":"1.1-mcq4","question":"1 см³ хуваарьтай цилиндрээр 20 см³ хэмжихэд хувийн алдаа хэд вэ?","options":["0.5%","2.5%","5%","10%"],"answer":1,"explanation":"0.5 ÷ 20 × 100% = 2.5%."},{"id":"1.1-mcq5","question":"Дээжийн хайлах цэг 78–80 °C, цэвэр бодисынх 82 °C. Дүгнэлт?","options":["Дээж цэвэр","Дээжид хольц байна","Термометр эвдэрсэн","Дээж буцалж байна"],"answer":1,"explanation":"Хольц хайлах цэгийг бууруулж, мужид хайлуулдаг."},{"id":"1.1-mcq6","question":"Урвалын хурдыг хэмжихэд хугацааг аль багажаар хэмжих вэ?","options":["Термометр","Хугацаа хэмжигч","Техник жин","Бюретка"],"answer":1,"explanation":"Хугацааг секундомер буюу хугацаа хэмжигчээр хэмжинэ."},{"id":"1.1-mcq7","question":"Элс ба усны холимгоос усыг ялгахад аль багажийн хослол хэрэгтэй вэ?","options":["Юүлүүр, шүүлтүүрийн цаас, шувтан колбо","Пипетка, бюретка","Термометр, жин","Ууршуулагч аяга, хуруу шил баригч"],"answer":0,"explanation":"Уусдаггүй хатуу бодисыг шүүж ялгана. Ус шувтан колбонд шүүгдэс болж урсана."},{"id":"1.1-mcq8","question":"Пипеткээр уусмал соруулахдаа юу хэрэглэх вэ?","options":["Амаар сорно","Резинэн соруул","Шилэн савх","Дусаагуур"],"answer":1,"explanation":"Хорт бодис залгихаас сэргийлж резинэн соруул ашиглана."}],"questions":[{"id":"1.1-Q1","level":"easy","stem":"Лабораторид дараах багажууд байна: шилэн аяга, хэмжээст цилиндр, термометр, хугацаа хэмжигч, техник жин.","totalMarks":4,"parts":[{"label":"а","prompt":"Магнийн туузыг хүчилд хийхэд урвал дуусах хугацааг хэмжихэд аль багаж хэрэгтэй вэ?","marks":1,"scheme":["Хугацаа хэмжигч (секундомер)"],"model":"Хугацаа хэмжигч."},{"label":"б","prompt":"Хүчлийн 20 см³-ыг ойролцоогоор хэмжихэд аль багажийг сонгох вэ? Яагаад шилэн аяга тохирохгүй вэ?","marks":2,"scheme":["Хэмжээст цилиндр","Шилэн аяганы хуваарь ойролцоо утга заадаг / нарийвчлал муу"],"model":"Хэмжээст цилиндр. Шилэн аяганы хуваарь зөвхөн ойролцоо утга заадаг тул эзлэхүүн хэмжихэд тохиромжгүй."},{"label":"в","prompt":"Урвалын үед температурын өөрчлөлтийг хэмжих багажийг нэрлэж, нэгжийг бич.","marks":1,"scheme":["Термометр, °C (хоёулаа зөв бол 1 оноо)"],"model":"Термометр; градус Цельс (°C)."}]},{"id":"1.1-Q2","level":"medium","stem":"Сурагч 1 см³ хуваарьтай хэмжээст цилиндр ашиглан нэг удаа 10 см³, нөгөө удаа 50 см³ ус хэмжжээ.","totalMarks":5,"parts":[{"label":"а","prompt":"Хэмжилт бүрийн хувийн алдааг тооцоол.","marks":2,"scheme":["10 см³: 0.5/10×100 = 5%","50 см³: 0.5/50×100 = 1%"],"model":"10 см³-д 5%, 50 см³-д 1%."},{"label":"б","prompt":"Хариултаас ямар дүгнэлт хийх вэ?","marks":1,"scheme":["Ижил багажаар их эзлэхүүн хэмжихэд хувийн алдаа бага"],"model":"Ижил багажаар их эзлэхүүн хэмжих тусам хувийн алдаа багасна."},{"label":"в","prompt":"10 см³-ыг 0.5%-иас бага алдаатай хэмжих багажийг санал болгож, тооцоогоор батал.","marks":2,"scheme":["Пипетка (эсвэл бюретка)","0.05/10×100 = 0.5%"],"model":"10 см³-ын пипетка: 0.05 ÷ 10 × 100% = 0.5%."}]},{"id":"1.1-Q3","level":"medium","stem":"Хэмжээст цилиндр доторх шингэний гадаргуу муруй хэлбэртэй байна.","totalMarks":3,"parts":[{"label":"а","prompt":"Энэ муруй гадаргууг юу гэж нэрлэдэг вэ?","marks":1,"scheme":["Мениск"],"model":"Мениск."},{"label":"б","prompt":"Хэмжилтийг хэрхэн зөв унших, яагаад тэгэх ёстойг тайлбарла.","marks":2,"scheme":["Нүдийг менискийн түвшинд байлгах","Доод хэсгээр унших / дээрээс эсвэл доороос харвал (параллакс) алдаа гарна"],"model":"Нүдээ менискийн түвшинд байлгаж, менискийн доод хэсгээр уншина. Дээрээс харвал заалт илүү, доороос харвал бага уншигдаж алдаа гарна."}]},{"id":"1.1-Q4","level":"hard","stem":"Х шингэний буцлах цэг уснаас бага гэдгийг шалгах туршилт төлөвлөх хэрэгтэй.","totalMarks":6,"parts":[{"label":"а","prompt":"Шаардлагатай багажийг жагсаа.","marks":2,"scheme":["Халаагуур, гурван хөлт суурь/тор эсвэл усан халаагуур","Термометр + дээжийн сав (хуруу шил/шилэн аяга)"],"model":"Хуруу шил эсвэл шилэн аяга, термометр, халаагуур (усан халаагуур илүү аюулгүй), штатив."},{"label":"б","prompt":"Туршилтын алхмыг бичиж, буцлах цэгийг хэрхэн тодорхойлохыг тайлбарла.","marks":3,"scheme":["Шингэнийг аажим халааж температурыг тогтмол хугацаанд тэмдэглэнэ","Шингэн буцалж байхад температур тогтмол болсон утга = буцлах цэг","Ижил аргаар устай харьцуулна / давтаж дунджийг авна"],"model":"Х шингэн ба усыг ижил нөхцөлд аажим халааж, 30 секунд тутам температурыг тэмдэглэнэ. Буцалж эхлэхэд температур тогтмол болох утгыг буцлах цэг гэж авна. Хоёр утгыг харьцуулж, туршилтыг давтана."},{"label":"в","prompt":"Нэг аюулгүй ажиллагааны арга хэмжээг бич.","marks":1,"scheme":["Нүдний шил / шатамхай бол ил дөл хэрэглэхгүй, усан халаагуур ашиглах"],"model":"Хамгаалалтын шил зүүнэ. Шингэн шатамхай байж болох тул ил дөлний оронд усан халаагуур хэрэглэнэ."}]}],"practicals":[{"id":"1.1-prac1","labActivityId":null,"title":"Урвал бүрэн явагдах хугацааг хэмжих","ref":"Туршилт 1, х.10","aim":"Магни давсны хүчилтэй урвалд орох хугацааг хэмжих","steps":["10 мл давсны хүчлийг шилэн аяганд хийнэ","2 см магнийн тууз нэмж хугацаа хэмжигчийг асаана","Хийн бөмбөлөг гарахаа болих үед зогсооно","Хүхрийн хүчлээр давтаж харьцуулна"],"safety":"Хамгаалалтын шил зүүнэ; хүчил арьсанд хүрвэл их усаар угаана.","result":"Хий ялгарахаа больсон нь урвал дууссаныг заана."},{"id":"1.1-prac2","labActivityId":null,"title":"Цэвэр ба хольцтой мөсний хайлах цэг","ref":"Туршилт 2, х.13","aim":"Хольц хайлах цэгт хэрхэн нөлөөлөхийг харах","steps":["Жижиглэсэн мөсөнд термометр дүрнэ","30 секунд тутам температурыг тэмдэглэнэ","Мөсөн дээр давс цацаж давтана"],"safety":"Термометрийг болгоомжтой барина.","result":"Цэвэр мөс 0 °C-д, давстай мөс 0 °C-аас доош хайлна."}]},{"id":"1.2","chapterId":"ch1","title":"Давс гарган авах техник","bookPages":"18–32","objectives":[{"id":"1.2-obj1","text":"Давсны найрлага, нэршлийг тайлбарлах; карбонат, сульфат ион дахь элементүүдийг нэрлэх"},{"id":"1.2-obj2","text":"Металл, металлын оксид, карбонатаас давс гарган авах аргыг тайлбарлах"},{"id":"1.2-obj3","text":"Давс гаргах урвалын үгэн тэгшитгэлийг бичих"},{"id":"1.2-obj4","text":"Давс байгальд орших хэлбэр ба лабораторид гарган авах аргыг харьцуулах"}],"keyTerms":["давс","ион","хлорид","сульфат","нитрат","карбонат","саармагжих урвал","тунадас","шүүгдэс"],"notes":[{"id":"1.2a","title":"Давсны найрлага ба нэршил","blocks":[{"t":"key","term":"Давс","x":"Металлын эерэг ион ба металл бишийн (эсвэл олон атомт) сөрөг ионоос тогтсон нэгдэл. Жишээ: хоолны давс NaCl = Na^+ ба Cl^- ион."},{"t":"p","x":"Давсыг **металлын нэр + сөрөг ионы нэр** гэж нэрлэнэ. Сөрөг ионы нэр нь давсыг үүсгэсэн хүчлээс хамаарна."},{"t":"table","head":["Хүчил","Томьёо","Сөрөг ион","Давсны нэр"],"rows":[["Давсны хүчил (устөрөгчийн хлорид)","HCl","Cl^- (хлорид)","…хлорид"],["Хүхрийн хүчил","H_2SO_4","SO_4^2- (сульфат)","…сульфат"],["Азотын хүчил","HNO_3","NO_3^- (нитрат)","…нитрат"],["Нүүрсний хүчил","H_2CO_3","CO_3^2- (карбонат)","…карбонат"]]},{"t":"ex","q":"Кальцийн карбонат CaCO_3 ямар ионуудаас тогтох вэ? Сөрөг ион ямар элементүүдээс бүрдэх вэ?","a":"Ca^2+ ба CO_3^2- ион. Карбонат ион нь **нүүрстөрөгч ба хүчилтөрөгчөөс** бүрдэнэ."},{"t":"table","head":["Давс","Томьёо","Хэрэглээ"],"rows":[["Калийн хлорид","KCl","Бордоо"],["Натрийн карбонат","Na_2CO_3","Шил үйлдвэрлэл"],["Зэсийн сульфат","CuSO_4","Хөдөө аж ахуй, хортон шавжтай тэмцэх"],["Цайрын нитрат","Zn(NO_3)_2","Будаг үйлдвэрлэл"],["Кальцийн сульфат (гипс)","CaSO_4","Яс бэхлэх гипс, барилга"]]},{"t":"warn","x":"Карбонат (CO_3^2-) ба гидрокарбонат (HCO_3^-)-ыг андуурах. Хүнсний сод NaHCO_3 нь **гидрокарбонат** тул натри, устөрөгч, нүүрстөрөгч, хүчилтөрөгч агуулна."},{"t":"errata","x":"Сурах бичгийн хүснэгт 1.2.1-д нитрат ионыг NO_3^2- гэж бичсэн. Зөв нь **NO_3^-** (−1 цэнэгтэй)."}]},{"id":"1.2b","title":"Давс байгальд орших хэлбэр","blocks":[{"t":"p","x":"Ихэнх элемент байгальд дангаараа биш, **эрдэс** болон давсны хэлбэрээр оршдог. Эрдэс гэдэг нь дэлхийн царцдаст байгалийн аргаар үүссэн, тодорхой найрлагатай бодис."},{"t":"list","items":["**Натрийн хлорид:** чулуун (жамц) давс; Увс нуур, Давст уул зэрэг Монголын эх үүсвэр","**Кальцийн карбонат:** шохойн чулуу, гантиг, далайн хясаа. Ус болон CO_2-той урвалд орж уусах кальцийн гидрокарбонат болж, агуй үүсгэдэг","**Кальцийн сульфат:** гөлтгөнө (гипс); эмнэлэгт яс бэхлэх, барилгын чимэглэлд","**Калийн нитрат:** эрт үеэс бордоонд хэрэглэсэн"]},{"t":"fact","x":"Байгалийн давсыг олборлоод уусгаж, шүүж, ууршуулан цэвэршүүлдэг. Эрдэс байдлаар олддоггүй давсыг химийн урвалаар гарган авдаг."}]},{"id":"1.2c","title":"Давс гаргах урвалын ерөнхий тэгшитгэл","blocks":[{"t":"p","x":"Доорх долоон ерөнхий тэгшитгэлийг цээжлэх нь бүлгийн бүх асуултын суурь болно."},{"t":"table","head":["Ерөнхий тэгшитгэл","Жишээ"],"rows":[["Металл + Хүчил → Давс + Устөрөгч","Цайр + Хүхрийн хүчил → Цайрын сульфат + Устөрөгч"],["Металлын оксид + Хүчил → Давс + Ус","Зэсийн оксид + Хүхрийн хүчил → Зэсийн сульфат + Ус"],["Суурь + Хүчил → Давс + Ус","Натрийн гидроксид + Давсны хүчил → Натрийн хлорид + Ус"],["Металлын карбонат + Хүчил → Давс + Ус + Нүүрсхүчлийн хий","Кальцийн карбонат + Давсны хүчил → Кальцийн хлорид + Ус + Нүүрсхүчлийн хий"],["Металл + Металл биш → Давс","Зэс + Хүхэр → Зэсийн сульфид"],["Металл бишийн оксид + Суурь → Давс + Ус","Нүүрстөрөгчийн диоксид + Кальцийн гидроксид → Кальцийн карбонат + Ус"],["Давс 1 + Давс 2 → Давс 3 + Давс 4","Натрийн сульфат + Барийн хлорид → Барийн сульфат + Натрийн хлорид"]]},{"t":"tip","x":"Давсны нэрийн **эхний хэсэг** металл/суурь/карбонатаас, **хоёр дахь хэсэг** хүчлээс ирдэг. Хүхрийн хүчил → сульфат, давсны хүчил → хлорид, азотын хүчил → нитрат."},{"t":"warn","x":"Мөнгө, алт, зэс сулруулсан хүчилтэй урвалд ордоггүй (идэвхийн эгнээнд устөрөгчөөс доор). Тиймээс «Зэс + Давсны хүчил → …» гэж бичихгүй. Зэсийн давсыг оксид эсвэл карбонатаас гаргана."},{"t":"errata","x":"Сурах бичигт «Цайр + Азотын хүчил → Цайрын нитрат + Устөрөгч» гэж өгсөн. Бодит байдал дээр азотын хүчил металлтай урвалд ороход ихэвчлэн устөрөгч биш азотын оксидууд ялгардаг. 8-р ангийн шалгалтад сурах бичгийн хувилбарыг хүлээн авдаг ч ерөнхий дүрмийн жишээнд хүхрийн эсвэл давсны хүчлийг хэрэглэх нь найдвартай."}]},{"id":"1.2d","title":"Уусдаг давсыг хатуу бодисоос гаргах","blocks":[{"t":"fig","name":"saltflow","cap":"Карбонат (эсвэл металл, оксид)-аас уусдаг давс гаргах дараалал"},{"t":"steps","items":["Шилэн аяганд сулруулсан хүчил хийнэ (савны 1/3-ээс ихгүй)","Хатуу бодисыг бага багаар хутгаж нэмнэ. **Илүүдэл** болж, уусахаа болих хүртэл (хий гарахаа болино) нэмнэ","Урвалд ороогүй илүүдэл хатуу бодисыг **шүүнэ**. Шүүгдэс нь давсны уусмал","Шүүгдсийг ууршуулагч аяганд хийж, **талст үүсч эхлэх хүртэл** ууршуулна","Хөргөж талстжуулна, дараа нь талстыг шүүж авна","Талстыг шүүлтүүрийн цаасны хооронд хавчуулж эсвэл тасалгааны температурт хатаана"]},{"t":"ex","q":"Яагаад хатуу бодисыг илүүдлээр нэмдэг вэ?","a":"Хүчил бүрэн урвалд орж дуусна. Ингэснээр уусмалд зөвхөн давс үлдэнэ. Хэтэрсэн хатуу бодис уусдаггүй тул шүүлтүүрээр амархан зайлуулна."},{"t":"ex","q":"Уусмалыг халуунаар шүүх үү, хүйтнээр шүүх үү?","a":"**Хөргөсний дараа** шүүнэ. Ихэнх давс хүйтэн усанд муу уусдаг тул хөргөхөд илүү их талст үүсэж, гарц нэмэгдэнэ."},{"t":"warn","x":"Уусмалыг бүрэн хуурай болтол ууршуулбал талст биш нунтаг үүсч, цацарч, зарим давс (жишээ нь CuSO_4) задарна. Талстжих цэг хүртэл ууршуулаад, үлдсэнийг аажим хөргө."},{"t":"key","term":"Хийг таних","x":"**Нүүрсхүчлийн хий:** шохойн ус (кальцийн гидроксидын уусмал) булингартана. **Устөрөгч:** асаж буй зомголыг ойртуулахад «пах» гэж дуугарч шатна."},{"t":"p","x":"Бага хэмжээний давсыг хуруу шилэнд, хий дамжуулах хоолой бүхий бөглөөтэй гаргаж болно. Ингэхэд ялгарсан хийг шохойн усаар шууд шалгана."}]},{"id":"1.2e","title":"Уусмалаас ба тунадасжуулж давс гаргах","blocks":[{"t":"p","x":"**Хоёр уусмалаас (саармагжуулах):** Хүчлийн уусмалд индикатор (лакмус) дусааж, натрийн карбонат эсвэл натрийн гидроксидын уусмалыг бага багаар нэмнэ. Индикаторын өнгө өөрчлөгдөх үед урвал дууссан. Индикаторын өнгийг арилгахын тулд модны (идэвхжүүлсэн) нүүрс хийгээд шүүнэ, дараа нь ууршуулна."},{"t":"eq","x":"Хүчил + Суурь → Давс + Ус"},{"t":"p","x":"**Тунадасжуулах:** Уусдаггүй давсыг хоёр уусдаг давсны уусмалыг холиж гаргана. Тунадасыг шүүж, нэрмэл усаар угааж, хатаана."},{"t":"eq","x":"Натрийн сульфат + Барийн хлорид → Барийн сульфат↓ (цагаан) + Натрийн хлорид"},{"t":"table","head":["Ион","Урвалж","Ажиглалт"],"rows":[["Хлорид Cl^-","Мөнгөний нитратын уусмал","Цагаан тунадас (мөнгөний хлорид)"],["Сульфат SO_4^2-","Барийн хлоридын уусмал","Цагаан тунадас (барийн сульфат)"],["Ус","Усгүй (цагаан) зэсийн сульфат","Цагаанаас цэнхэр болно"]]},{"t":"tip","x":"Уусдаг давсыг илүүдэл + шүүх + ууршуулах аргаар, уусдаггүй давсыг тунадасжуулах аргаар гаргана. Асуултад «аргаа сонгож үндэслэлээ бич» гэвэл давсны уусах чанарыг заавал дурд."},{"t":"warn","x":"Хүчилтэй ажиллахдаа: сулруулсан хүчил **цочроох**, өтгөн хүчил **идэмхий**. Арьсанд хүрвэл эхлээд их хэмжээний хүйтэн усаар угаана."}]}],"flashcards":[{"id":"1.2-fc1","front":"Давс гэж юу вэ?","back":"Металлын эерэг ион ба сөрөг ионоос тогтсон нэгдэл (жишээ: NaCl = Na^+ + Cl^-)."},{"id":"1.2-fc2","front":"Хүхрийн хүчлээс ямар нэртэй давс үүсэх вэ?","back":"Сульфат (SO_4^2-)."},{"id":"1.2-fc3","front":"Металлын карбонат + Хүчил → ?","back":"Давс + Ус + Нүүрсхүчлийн хий"},{"id":"1.2-fc4","front":"Металл + Хүчил → ?","back":"Давс + Устөрөгч"},{"id":"1.2-fc5","front":"Нүүрсхүчлийн хийг яаж таних вэ?","back":"Шохойн усаар нэвтрүүлэхэд булингартана (цагаан тунадас үүснэ)."},{"id":"1.2-fc6","front":"Устөрөгчийг :"ch2","title":"Элементийн нээгдсэн түүх","bookPages":"58–66","objectives":[{"id":"2.3-obj1","text":"Түүхэн болон орчин үеийн жишээгээр баримт нотолгоо, тайлбарын ач холбогдлыг хэлэлцэх"},{"id":"2.3-obj2","text":"Судлаачид хэрхэн туршилт хийж, нотолгоо гаргаж, бүтээлчээр сэтгэдгийг тайлбарлах"},{"id":"2.3-obj3","text":"Үелэх хүснэгт хэрхэн бүтээгдсэнийг он дарааллаар тайлбарлах"}],"keyTerms":["эртний элемент","алхими","цахилгаанаар задлах","спектрийн арга","триад","октавын дүрэм"],"notes":[{"id":"2.3a","title":"Элементүүд хэрхэн нээгдсэн бэ?","blocks":[{"t":"key","term":"Эртний элемент","x":"Нээсэн хүн, цаг хугацаа нь тодорхойгүй, эрт дээр үеэс мэдэгдэж байсан элемент: нүүрстөрөгч, хүхэр, алт, мөнгө, зэс, төмөр, цагаан тугалга, мөнгөн ус, хар тугалга."},{"t":"fig","name":"timeline","cap":"Зарим элементийн нээлтийн он"},{"t":"table","head":["Элемент","Он","Эрдэмтэн","Арга / нотолгоо"],"rows":[["Фосфор","1669","Х. Брандт","Шээсийг боловсруулж, харанхуйд гэрэлтэх бодис гаргасан. Нээгчийн нэр тодорхой анхны элемент"],["Устөрөгч","1766","Г. Кавендиш","Металл дээр хүчил үйлчилж «шатамхай агаар» гаргасан; маш хөнгөн хий гэдгийг тогтоосон"],["Хүчилтөрөгч","1771–1774","К. Шееле; Ж. Пристли","Шееле «галт агаар»; Пристли мөнгөн усны оксидыг халааж гаргасан. Нэрийг А. Лавуазье өгсөн"],["Кали, натри","1807","Г. Дэви","Хайлмал нэгдлийг цахилгаан гүйдлээр задалсан"],["Кальци, магни","1808","Г. Дэви","Мөн цахилгаанаар задлах арга"],["Аргон","1894","У. Рамзай, Ж. Рэлей","Агаарын «азот» нь цэвэр азотоос хүнд байсныг тайлбарласан"],["Неон, криптон, ксенон","1898","У. Рамзай, М. Траверс","Шингэн агаарыг ялгаж, гэрлийн спектрээр танисан"]]},{"t":"p","x":"**Дэвигийн зүтгэл:** усан уусмалыг задлахад зөвхөн ус задарч байсан тул хуурай нэгдлийг оролдсон, тэр нь гүйдэл дамжуулаагүй. Эцэст нь калийн гидроксидыг **хайлуулж** гүйдэл нэвтрүүлснээр металл кали гаргасан. Бүтэлгүйтэл бүрээс дараагийн таамаглал гарч ирсэн нь шинжлэх ухааны арга барилын жишээ."},{"t":"errata","x":"Сурах бичигт 1868 онд гелийг Рамзай нээсэн мэт бичсэн. 1868 онд **П. Жанссен ба Н. Локьер** нарны гэрлийн спектрээс гелийг илрүүлсэн; дэлхий дээр **Рамзай 1895** онд ялгаж авсан."}]},{"id":"2.3b","title":"Үелэх хүснэгт хэрхэн бүтээгдсэн бэ?","blocks":[{"t":"table","head":["Он","Эрдэмтэн","Санаа"],"rows":[["~1829","И. Дёберейнер","**Триад**: Cl–Br–I, Li–Na–K гурвалд дунд элементийн масс нь хоёр захынхны дундажтай ойролцоо"],["1864–1865","Ж. Ньюлендс","**Октавын дүрэм**: масс өсөх дарааллаар 8 дахь элемент бүр төстэй. Бусад химичид шоолж хүлээн аваагүй"],["1869","Д.И. Менделеев","Элементийн карт ашиглан атом масс ба шинжээр эрэмбэлэв. **Нээгдээгүй элементэд хоосон нүд үлдээж**, шинжийг нь урьдчилан хэлэв"],["1875–1886","Буабодран, Нильсон, Винклер","Галли (эка-хөнгөнцагаан), сканди (эка-бор), германи (эка-цахиур) нээгдэж, таамаглал батлагдав"],["1940-өөд","Г. Сиборг","Актиноидуудыг тусдаа эгнээнд байрлуулав; 106-р элемент сиборги (Sg)"]]},{"t":"ex","q":"Дёберейнерийн триадыг шалга: Li = 7, Na = 23, K = 39.","a":"(7 + 39) ÷ 2 = **23** = натрийн масс. Триад таарч байна."},{"t":"tip","x":"Менделеевийг бусдаас ялгах гол санаа: **хоосон нүд үлдээж, урьдчилан таамагласан**, тэр таамаглал нь хожим туршилтаар батлагдсан. Шинжлэх ухаанд онол урьдчилан таамаглах чадвараараа үнэлэгддэг."},{"t":"fact","x":"Орчин үеийн үелэх хүснэгтэд элементүүдийг атом массаар биш **дэс дугаараар (протоны тоо)** эрэмбэлдэг. Ингэснээр Менделеевийн хүснэгт дэх цөөн хэдэн «урвуу» хосын асуудал шийдэгдсэн."},{"t":"errata","x":"Сурах бичгийн х.65-д Менделеевийн таамагласан элементийг «44, 68, 100 дугаар элемент» гэжээ. Эдгээр нь ойролцоо **атом масс**; сканди, галли, германийн дэс дугаар 21, 31, 32."}]}],"flashcards":[{"id":"2.3-fc1","front":"Эртний элемент гэж юу вэ?","back":"Нээсэн хүн, он нь тодорхойгүй, эрт үеэс мэдэгдэж байсан элемент (C, S, Au, Ag, Cu, Fe, Sn, Hg, Pb)."},{"id":"2.3-fc2","front":"Нээгч нь тодорхой анхны элемент?","back":"Фосфор, 1669, Х. Брандт."},{"id":"2.3-fc3","front":"Кавендиш устөрөгчийг юу гэ  → урвал явахгүй. Идэвх буурах дарааллаар жагсаа.","a":"A нь B-г хална → A > B. C нь A-г хална → C > A. B нь C-г халж чадахгүй → C > B. Иймд **C > A > B**. (Нөхцөл бүрийг «хэн хэнээс идэвхтэй» гэж тус тусад нь бичээд нэгтгэ.)"},{"t":"p","x":"**Галогений эгнээ:** F > Cl > Br > I (үелэх хүснэгтийн байрлалтай ижил)."},{"t":"table","head":["Холимог","Үр дүн"],"rows":[["Хлорын ус + Калийн бромид","Урвал явагдана → улбар шар (бром)"],["Хлорын ус + Калийн иодид","Урвал явагдана → хүрэн (иод)"],["Бромын ус + Калийн иодид","Урвал явагдана → хүрэн (иод)"],["Иодын ус + Калийн бромид","Урвал явагдахгүй"]]},{"t":"warn","x":"Хоёр **металл** эсвэл хоёр **галогеныг** л харьцуулна. «Хлор + Магнийн бромид»-д хлор бромыг халдаг, магнитай хамаагүй."}]},{"id":"3.1d","title":"Идэвхийн эгнээ ба амьдрал","blocks":[{"t":"list","items":["**Байгальд орших:** эгнээний доод хэсгийн металл (алт, мөнгө, зэс) дангаараа олдоно; дээд хэсгийнх зөвхөн нэгдлээр. Тиймээс алт, зэсийг эрт мэддэг байсан, натри, калийг 1807 онд л ялгасан","**Металл гарган авах:** нүүрстөрөгчөөс доорх металлын оксидыг (цайр, төмөр) нүүрстөрөгчөөр халж гаргана. Нүүрстөрөгчөөс дээрх металлыг (натри, хөнгөнцагаан) цахилгаанаар задалж гаргана","**Термит урвал:** хөнгөнцагаан + төмрийн оксид → хөнгөнцагааны оксид + төмөр. Маш их дулаан ялгарч хайлмал төмөр үүсдэг тул төмөр замын рельс гагнахад хэрэглэдэг","**Зэврэлт:** идэвхтэй металл хурдан исэлдэнэ. Хөнгөнцагаан идэвхтэй ч гадаргуудаа нимгэн, нягт оксидын бүрхүүл үүсгэж цааш зэврэхээс хамгаалагддаг","**Усны хоолой зэсээр:** зэс устай урвалд ордоггүй, зэврэлт удаан"]},{"t":"eq","x":"Цайрын оксид + Нүүрстөрөгч → Цайр + Нүүрстөрөгчийн оксид"},{"t":"tip","x":"«Яагаад хүчлийг ган саванд хадгалж болохгүй вэ?» → Төмөр устөрөгчөөс дээр байрлах тул хүчилтэй урвалд орж сав идэгдэнэ."}]}],"flashcards":[{"id":"3.1-fc1","front":"Халах урвал гэж юу вэ?","back":"Идэвхтэй элемент нэгдлээс идэвх муутай элементийг халж, шинэ нэгдэл ба өөр элемент үүсгэх урвал."},{"id":"3.1-fc2","front":"Металлын атрийг яагаад 1807 оныг хүртэл ялгаж чадаагүй вэ?","options":["Маш ховор","Маш идэвхтэй тул нэгдэл хэлбэрээр л оршдог","Хийн төлөвтэй","Цацраг идэвхтэй"],"answer":1,"explanation":"Идэвхтэй металлыг нэгдлээс нь салгахад цахилгаан шаардлагатай байсан."},{"id":"3.1-mcq6","question":"A + BX → AX + B ба B + CX → BX + C. Идэвх буурах дараалал?","options":["C > B > A","A > B > C","B > A > C","A > C > B"],"answer":1,"explanation":"A нь B-г, B нь C-г хална."},{"id":"3.1-mcq7","question":"Дараахаас аль металлыг оксидоос нь нүүрстөрөгчөөр гаргаж болохгүй вэ?","options":["Төмөр","Цайр","Хөнгөнцагаан","Зэс"],"answer":2,"explanation":"Хөнгөнцагаан нүүрстөрөгчөөс дээр байрлана."},{"id":"3.1-mcq8","question":"Иод + Калийн бромид → ?","options":["Калийн иодид + Бром","Урвал явагдахгүй","Калийн бромат","Иодын бромид"],"answer":1,"explanation":"Иод бромоос идэвх муу."}],"questions":[{"id":"3.1-Q1","level":"easy","stem":"Сурагч дараах үр дүнг авчээ: Цайр + Төмрийн сульфат → урвалд орно; Төмөр + Хар тугалганы нитрат → урвалд орно; Цайр + Магнийн хлорид → урвалд орохгүй.","totalMarks":3,"parts":[{"label":"а","prompt":"Цайр, төмөр, хар тугалга, магнийг идэвх **өсөх** дарааллаар жагсаа.","marks":2,"scheme":["Хар тугалга \u003c Төмөр (доод хоёр зөв дараалалтай)","Цайр \u003c Магни (дээд хоёр зөв дараалалтай)"],"model":"Хар тугалга \u003c Төмөр \u003c Цайр \u003c Магни"},{"label":"б","prompt":"Цайр + Төмрийн сульфат урвалын үгэн тэгшитгэлийг бич.","marks":1,"scheme":["Цайр + Төмрийн сульфат → Цайрын сульфат + Төмөр"],"model":"Цайр + Төмрийн сульфат → Цайрын сульфат + Төмөр"}]},{"id":"3.1-Q2","level":"medium","stem":"Дараах урвал явагдах эсэхийг тогтоож, явагдах бол үгэн тэгшитгэлийг бич.","totalMarks":4,"parts":[{"label":"а","prompt":"Цайр + Хар тугалганы нитрат","marks":1,"scheme":["Явагдана: Цайр + Хар тугалганы нитрат → Цайрын нитрат + Хар тугалга"],"model":"Явагдана. Цайр + Хар тугалганы нитрат → Цайрын нитрат + Хар тугалга"},{"label":"б","prompt":"Кальци + Төмрийн сульфат","marks":1,"sc эрлэж, тэгшитгэлийг бич.","marks":2,"scheme":["Магнийн сульфат","Магни + Хүхрийн хүчил → Магнийн сульфат + Устөрөгч"],"model":"Магнийн сульфат. Магни + Хүхрийн хүчил → Магнийн сульфат + Устөрөгч"},{"label":"в","prompt":"Цайрыг нэмбэл урвалын эрчим аль хоёрын хооронд байх вэ?","marks":1,"scheme":["Магни ба төмрийн хооронд (В ба Б)"],"model":"Магни (В) ба төмөр (Б)-ийн хооронд."}]}],"practicals":[{"id":"3.1-prac1","labActivityId":null,"title":"Металлын халах урвалыг судлах","ref":"Туршилт 1, х.72","aim":"Зэс, магни, мөнгийг нитратын уусмалуудтай харьцуулах","steps":["Хонхортой тавганд металл бүрийг байрлуулна","Металл бүр дээр нитратын уусмалуудыг дусаана","Өнгө, гадаргуугийн өөрчлөлтийг хүснэгтэд тэмдэглэнэ"],"safety":"Мөнгөний нитрат арьсыг харлуулна; бээлий өмсөнө.","result":"Mg > Cu > Ag гэсэн дараалал гарна."},{"id":"3.1-prac2","labActivityId":null,"title":"Идэвхийн эгнээг бүтээх","ref":"Туршилт 2, х.75","aim":"Ус, уур, хүчил, давстай урвалаар эгнээ бүтээх","steps":["Металлыг хүйтэн устай туршина","Урвал явагдахгүй бол усны ууртай туршина","Сулруулсан давсны хүчилтэй туршина","Давсны уусмалуудтай хослуулж хүснэгт бөглөнө"],"safety":"Натриг ашиглахгүй; усны уураар халаахдаа буцалгуур хийнэ.","result":"Ca > Mg > Zn > Fe > Pb > Cu"},{"id":"3.1-prac3","labActivityId":null,"title":"Галогений идэвхийг харьцуулах","ref":"Туршилт 3, х.80","aim":"Галогений халах урвалаар эгнээ бүтээх","steps":["KCl, KBr, KI уусмал бүхий хуруу шилийг дугаарлана","Хлорын, бромын, иодын усыг хослуулан нэмнэ","Өнгөний өөрчлөлтийг тэмдэглэнэ"],"safety":"Хлор, бром хортой; татах шүүгээнд ажиллана.","result":"Cl > Br > I"}]},{"id":"3.2","chapterId":"ch3","title":"Урвалын хурд, түүнд нөлөөлөх хүчин зүйл","bookPages":"89–104","objectives":[{"id":"3.2-obj1","text":"Урвалын хурдыг тодорхойлж, хэмжих аргыг сонгох"},{"id":"3.2-obj2","text":"Концентрац, гадаргуугийн талбай, температур, катализаторын нөлөөг тодорхойлох"},{"id":"3.2-obj3","text":"Нөлөөг мөргөлдөлтийн онолоор тайлбарлах"},{"id":"3.2-obj4","text":"Хурдны графикийг уншиж, тайлбарлах"}],"keyTerms":["урвалын хурд","мөргөлдөлтийн онол","катализатор","ингибитор","концентрац","гадаргуугийн талбай","хувьсагч"],"notes":[{"id":"3.2a","title":"Урвалын хурд ба түүнийг хэмжих","blocks":[{"t":"key","term":"Урвалын хурд","x":"Нэгж хугацаанд урвалд орж буй бодисын эсвэл үүсч буй бүтээгдэхүүний тоо хэмжээ (масс, эзлэхүүн) хэр өөрчлөгдөж байгаа нь."},{"t":"eq","x":"Дундаж хурд = тоо хэмжээний өөрчлөлт ÷ зарцуулсан хугацаа"},{"t":"list","items":["**Хийн эзлэхүүнээр:** хийн тариур эсвэл устай хөмрүүлсэн хэмжээст цилиндрээр тодорхой хугацаа тутамд хэмжинэ","**Массын хорогдлоор:** колбыг техник жин дээр тавина; хий ялгарахын хэрээр масс буурна (ам дээр хөвөн бөглөө тавьж цацалтаас сэргийлнэ)","**Тунадас/өнгөөр:** тунадас үүсч, тэмдэг харагдахаа болих хугацааг хэмжинэ"]},{"t":"fig","name":"rategraph","cap":"Ялгарсан хийн эзлэхүүн — хугацаа"},{"t":"list","items":["Муруй **эгц** байх хэсэгт урвал **хурдан** (эхэнд урвалж хамгийн их)","Хугацаа өнгөрөх тусам налуу **багасна** → урвалжийн хэмжээ буурч хурд удааширна","Муруй **хэвтээ** болсон цэг = урвал **дууссан** (аль нэг урвалж бүрэн дууссан)"]},{"t":"ex","q":"Эхний 30 секундэд 24 см³ хий ялгарав. Дундаж хурд?","a":"24 см³ ÷ 30 с = **0.8 см³/с**."},{"t":"tip","x":"Хоёр муруйг харьцуулахдаа: эхлэлийн налуу эгц = хурдан. Урвалжийн хэмжээ ижил бол эцсийн эзлэхүүн **ижил** түвшинд хүрнэ; зөвхөн хурдан хүрнэ."}]},{"id":"3.2b","title":"Мөргөлдөлтийн онол","blocks":[{"t":"key","term":"Мөргөлдөлтийн онол","x":"Урвал явагдахын тулд урвалжийн жижиг хэсгүүд (атом, молекул, ион) хоорондоо **мөргөлдөх** ёстой бөгөөд мөргөлдөлт нь **хангалттай энергитэй**, зөв чиглэлтэй байх ёстой. Ийм мөргөлдөлтийг **ашигтай мөргөлдөлт** гэнэ."},{"t":"fig","name":"collision","cap":"Бага ба их концентрац"},{"t":"p","x":"Хурдыг өсгөх бүх арга нь **нэгж хугацаан дахь ашигтай мөргөлдөлтийн тоог** нэмэгдүүлдэг."},{"t":"warn","x":"«Бөөмс илүү мөргөлдөнө» гэж бичихэд оноо дутна. **«Нэгж хугацаанд илүү олон удаа мөргөлдөнө»** гэж давтамжийг заавал бич."}]},{"id":"3.2c","title":"Хурдад нөлөөлөх хүчин зүйлс","blocks":[{"t":"table","head":["Хүчин зүйл","Хурдад","Мөргөлдөлтийн онолын тайлбар"],"rows":[["Концентрац ↑","Ихэснэ","Тогтмол эзлэхүүнд илүү олон бөөм → нэгж хугацаан дахь мөргөлдөлт олширно"],["Гадаргуугийн талбай ↑ (нунтаглах)","Ихэснэ","Хатуу бодисын илүү олон бөөм ил гарч мөргөлдөх боломжтой болно"],["Температур ↑","Ихэснэ","Бөөмс илүү хурдан хөдөлж олон удаа мөргөлдөнө, мөн илүү олон мөргөлдөлт хангалттай энергитэй болно"],["Катализатор","Ихэснэ","Урвал явагдахад бага энерги шаардсан өөр зам бий болгож, илүү олон мөргөлдөлтийг ашигтай болгоно; өөрөө өөрчлөгдөхгүй"]]},{"t":"fig","name":"surface","cap":"Шоог хуваах тусам нийт гадаргуугийн талбай ихэснэ"},{"t":"errata","x":"Сурах бичгийн зураг 3.2.12-т 1 см³ шоог 1000 хэсэгт хуваахад 6000 см² болно гэжээ. Талын урт 0.1 см болох тул нийт талбай = 1000 × 6 × 0.01 = **60 см²** (10 дахин ихсэлт). 8 хэсэгт хуваахад 12 см² (2 дахин) гэдэг нь зөв."},{"t":"p","x":"Температурыг 10 °C нэмэхэд олон урвалын хурд **ойролцоогоор 2 дахин** ихэсдэг (ойролцоо дүрэм)."},{"t":"key","term":"Катализатор","x":"Урвалын хурдыг ихэсгэж, урвалын эцэст масс, найрлага нь өөрчлөгдөхгүй үлддэг бодис. Тэгшитгэлд сумны дээр бичнэ. Жишээ: устөрөгчийн хэт исэл задрахад манганы диоксид; машины каталитик хувиргагч."},{"t":"errata","x":"Сурах бичигт катализатор «мөргөлдөлтийн тоог ихэсгэнэ» гэжээ. Илүү зөв тайлбар: мөргөлдөлтийн тоо биш, **ашигтай болох мөргөлдөлтийн хувь** ихэснэ, учир нь бага энерги шаардсан өөр зам бий болно."},{"t":"fact","x":"**Ингибитор** урвалыг удаашруулна: хүнсний хадгалалтын бодис (нитрит, сульфит) муудах урвалыг удаашруулдаг. Гурил, нүүрсний тоос маш их гадаргуутай тул оч үсрэхэд **тэсэрч** болно."}]},{"id":"3.2d","title":"Шударга туршилт ба хувьсагч","blocks":[{"t":"table","head":["Хувьсагч","Утга","Жишээ (температурын нөлөө)"],"rows":[["Үл хамаарах","Судлаач өөрчилдөг","Температур"],["Хамаарах","Хэмжиж буй үр дүн","Урвал дуусах хугацаа / хийн эзлэхүүн"],["Хяналтын","Тогтмол байлгах ёстой","Хүчлийн концентрац, эзлэхүүн; металлын масс, хэлбэр"]]},{"t":"ex","q":"Батын туршилт: нунтаг магни, 20% хүчил, 20 °C. Оюуны туршилт: туузан магни, 20% хүчил, 20 °C. Ямар хүчин зүйлийг судалсан бэ?","a":"Зөвхөн магнийн хэлбэр өөр тул **гадаргуугийн талбайн** нөлөөг судалсан. Концентрац ба температур тогтмол."},{"t":"tip","x":"Хамгийн хурдан урвалыг сонгохдоо бүх хүчин зүйлийг шалга: **нунтаг + их концентрац + өндөр температур** (+ катализатор) хослол хамгийн хурдан."}]}],"flashcards":[{"id":"3.2-fc1","front":"Урвалын хурдыг хэмжих хоёр арга?","back":"Ялгарах хийн эзлэхүүн (тариур) эсвэл массын хорогдол (жин)."},{"id":"3.2-fc2","front":"Хурдны график хэвтээ болбол юу гэсэн үг вэ?","back":"Урвал дууссан; аль нэг урвалж бүрэн зарцуулагдсан."},{"id":"3.2-fc3","front":"Мөргөлдөлтийн онолын үндсэн санаа?","back":"Бөөмс хангалттай энергитэйгээр мөргөлдсөн үед л урвал явагдана."},{"id":"3.2-fc4","front":"Концентрац ихсэхэд яагаад хурд нэмэгддэг вэ?","back":"Тогтмол эзлэхүүнд илүү олон бөөм → нэгж хугацаанд илүү олон мөргөлдөлт."},{"id":"3.2-fc5","front":"Нунтаглахад яагаад хурдан явагддаг вэ?","back":"Гадаргуугийн талбай ихэсч, мөргөлдөх боломжтой бөөм олширно."},{"id":"3.2-fc6","front":"Температур ихсэхэд хурд яагаад нэмэгддэг вэ?","back":"Бөөмс хурдан хөдөлж олон мөргөлдөнө, илүү олон нь хангалттай энергитэй."},{"id":"3.2-fc7","front":"Катализатор гэж юу вэ?","back":"Хурдыг ихэсгэж, урвалын эцэст өөрчлөгдөөгүй үлддэг бодис."},{"id":"3.2-fc8","front":"Ингибитор гэж юу вэ?","back":"Урвалыг удаашруулдаг бодис (жишээ: хүнсний хадгалалтын бодис)."},{"id":"3.2-fc9","front":"Үл хамаарах хувьсагч?","back":"Судлаач зориуд өөрчилдөг хувьсагч."},{"id":"3.2-fc10","front":"Хамаарах хувьсагч?","back":"Хэмжиж буй үр дүн (хугацаа, хийн эзлэхүүн)."},{"id":"3.2-fc11","front":"1 см шоог 0.1 см-ийн 1000 шоо болгоход гадаргуу?","back":"6 см² → 60 см² (10 дахин)."}],"quiz":[{"id":"3.2-mcq1","question":"Ижил масстай шохойн чулууны аль хэлбэр давсны хүчилтэй хамгийн хурдан урвалд орох вэ?","options":["Нэг том хэсэг","Хэдэн жижиг хэсэг","Нунтаг","Бүгд адилхан"],"answer":2,"explanation":"Нунтаг хамгийн их гадаргуутай."},{"id":"3.2-mcq2","question":"Хүчлийн концентрацыг 2 дахин ихэсгэхэд хурд ихсэх шалтгаан?","options":["Бөөмс том болно","Нэгж хугацааны мөргөлдөлт олширно","Энерги буурна","Катализатор үүснэ"],"answer":1,"explanation":"Ижил эзлэхүүнд илүү олон бөөм."},{"id":"3.2-mcq3","question":"Катализаторын тухай аль нь буруу вэ?","options":["Хурдыг ихэсгэнэ","Урвалын эцэст өөрчлөгдөхгүй","Урвалд зарцуулагдаж дуусна","Дахин хэрэглэж болно"],"answer":2,"explanation":"Катализатор зарцуулагддаггүй."},{"id":"3.2-mcq4","question":"Хүнсийг хөргөгчид хадгалах шалтгаан?","options":["Нам температурт муудах урвал удаашрана","Хүйтэнд бактери үхнэ","Ус ууршина","Катализатор нэмэгдэнэ"],"answer":0,"explanation":"Температур буурахад урвалын хурд буурна."},{"id":"3.2-mcq5","question":"Хийн эзлэхүүн–хугацааны график эхэндээ эгц, дараа нь хэвтээ болсон. Хэвтээ хэсэг юуг заах вэ?","options":["Урвал хамгийн хурдан","Урвал дууссан","Катализатор нэмсэн","Температур өссөн"],"answer":1,"explanation":"Хий цааш ялгарахгүй байна."},{"id":"3.2-mcq6","question":"Магни + HCl урвалд хүчлийн концентрацыг өөрчлөн туршвал аль нь хяналтын хувьсагч вэ?","options":["Хүчлийн концентрац","Хийн эзлэхүүн","Магнийн масс ба температур","Хугацаа"],"answer":2,"explanation":"Бусад бүх нөхцөлийг тогтмол байлгана."},{"id":"3.2-mcq7","question":"Устөрөгчийн хэт исэл задрах урвалыг хурдасгах катализатор?","options":["Натрийн хлорид","Манганы диоксид","Ус","Кальцийн карбонат"],"answer":1,"explanation":"MnO_2 хүчилтөрөгч ялгаралтыг огцом хурдасгана."},{"id":"3.2-mcq8","question":"Эхний 20 секундэд 30 см³ хий ялгарсан бол дундаж хурд?","options":["0.67 см³/с","1.5 см³/с","10 см³/с","600 см³/с"],"answer":1,"explanation":"30 ÷ 20 = 1.5 см³/с."}],"questions":[{"id":"3.2-Q1","level":"medium","stem":"0.20 г магнийн тууз 30 см³ давсны хүчилтэй урвалд оров. Ялгарсан хий: 0 с — 0; 15 с — 19; 30 с — 32; 45 с — 44; 60 с — 55; 90 с — 68; 120 с — 75; 150 с — 76; 180 с — 76 см³.","totalMarks":6,"parts":[{"label":"а","prompt":"Урвал ойролцоогоор хэдэн секундэд дууссан бэ? Хэрхэн мэдсэн бэ?","marks":2,"scheme":["≈150 с","Хийн эзлэхүүн цааш өөрчлөгдөхгүй (76 см³)"],"model":"Ойролцоогоор 150 с; түүнээс хойш эзлэхүүн 76 см³ дээр тогтмол."},{"label":"б","prompt":"Эхний 30 секундын дундаж хурдыг тооцоол.","marks":1,"scheme":["32 ÷ 30 = 1.07 см³/с (≈1.1)"],"model":"32 ÷ 30 ≈ 1.1 см³/с"},{"label":"в","prompt":"Ижил массын нунтаг магни авбал график хэрхэн өөрчлөгдөх вэ? Эцсийн эзлэхүүн?","marks":2,"scheme":["Эхэндээ илүү эгц / хурдан дуусна","Эцсийн эзлэхүүн ижил (76 см³)"],"model":"Муруй илүү эгц болж эрт дуусна; магнийн масс ижил тул эцсийн эзлэхүүн 76 см³ хэвээр."},{"label":"г","prompt":"0.10 г магни авбал эцсийн эзлэхүүн ойролцоогоор хэд болох вэ?","marks":1,"scheme":["≈38 см³ (хагас)"],"model":"Ойролцоогоор 38 см³ (магни хагас тул хий хагас)."}]},{"id":"3.2-Q2","level":"medium","stem":"Аспирин УПСА шахмал эмийг янз бүрийн температуртай усанд хийж, хийн бөмбөлөг гарахаа болих хугацааг хэмжив.","totalMarks":5,"parts":[{"label":"а","prompt":"Үл хамаарах, хамаарах, хоёр хяналтын хувьсагчийг нэрлэ.","marks":3,"scheme":["Үл хамаарах: температур","Хамаарах: урвал дуусах хугацаа","Хяналтын: усны эзлэхүүн, шахмалын тоо/масс (хоёр зөв)"],"model":"Үл хамаарах — усны температур; хамаарах — урвал дуусах хугацаа; хяналтын — усны эзлэхүүн, нэг ижил шахмал."},{"label":"б","prompt":"Халуун усанд яагаад хурдан дуусах вэ? Мөргөлдөлтийн онолоор тайлбарла.","marks":2,"scheme":["Бөөмс илүү кинетик энергитэй, хурдан хөдөлнө","Нэгж хугацаанд илүү олон / илүү ашигтай мөргөлдөлт"],"model":"Өндөр температурт бөөмс хурдан хөдөлж нэгж хугацаанд олон удаа мөргөлдөх ба илүү олон мөргөлдөлт хангалттай энергитэй тул хурд ихэснэ."}]},{"id":"3.2-Q3","level":"hard","stem":"Цайр давсны хүчилтэй урвалд ороход янз бүрийн нэмэлтийн нөлөөг судлав: нэмэлтгүй — 5 ын ойролцоо тогтож утаа сарнидаггүй"]},{"t":"ex","q":"12-р сарын 10 хоногийн PM2.5: 110, 120, 115, 80, 70, 78, 79, 80, 100, 105 мкг/м³. Хүлцэх агууламж 50. Дүгнэлт?","a":"Бүх 10 өдөр хүлцэх агууламжаас **давсан**; хамгийн бага өдөр (70) ч 1.4 дахин, хамгийн их өдөр (120) **2.4 дахин** их. Дундаж ≈ 94 мкг/м³."},{"t":"tip","x":"Графикийн асуултад (1) хандлагыг тоогоор, (2) хүлцэх агууламжтай харьцуулж, (3) шалтгааныг улиралтай холбож бич."}]},{"id":"4.2c","title":"Усны бохирдол","blocks":[{"t":"key","term":"Усны бохирдол","x":"Хүний шууд ба шууд бус үйл ажиллагааны улмаас байгалийн усны найрлага өөрчлөгдөж, чанар доройтох (Усны тухай хуулийн тодорхойлолт)."},{"t":"list","items":["**Механик:** элс, шавар, хог хаягдал","**Химийн:** бензин, тос, угаагч нунтаг, үйлдвэрийн хүчил/шүлт, хүнд металл","**Биологийн:** ахуйн бохир ус, нян","Туул гол: үйлдвэрийн бохир ус, гол дээр машин, хивс угаах, хог хаях"]},{"t":"p","x":"**Арьс ширний үйлдвэр:** үс ноос авахад натрийн сульфид ба шохой хэрэглэдэг тул хаягдал ус маш **шүлтлэг**; идээлэхэд хромын давс хэрэглэдэг. Шүлтлэг усыг хүчлээр **саармагжуулж** бууруулдаг. Хэт их хүчил нэмбэл ус хүчиллэг болох тул индикатороор шалгаж бага багаар нэмнэ."},{"t":"eq","x":"Хүчил + Шүлт → Давс + Ус (саармагжих)"},{"t":"p","x":"**Энгийн шүүлтүүр:** хайрга → элс → идэвхжүүлсэн нүүрс → хөвөн. Хайрга, элс механик хольцыг, идэвхжүүлсэн нүүрс өнгө, үнэр, зарим химийн бодисыг шингээнэ. Ууссан давс, нянг бүрэн арилгадаггүй."},{"t":"fact","x":"Монгол ёс заншил усыг дээдэлдэг: булаг шанд, голд бохир зүйл хийхгүй, усны эхэнд айл буухгүй, гол руу үнс асгахгүй. «Ус — чандмань эрдэнэ»."}]},{"id":"4.2d","title":"Бохирдлоос сэргийлэх","blocks":[{"t":"table","head":["Түвшин","Агаар","Ус"],"rows":[["Хувь хүн","Хог шатаахгүй; нийтийн тээвэр, явган алхах; гэртээ чийгтэй цэвэрлэгээ; агаар шүүгч","Гол руу хог хаяхгүй; голд машин угаахгүй; угаагч бодисыг хэмнэх"],["Хот, орон нутаг","Сайжруулсан түлш, утаагүй зуух; мод тарих; замыг хатуу хучилттай болгох","Цэвэрлэх ба рах бичигт дурдсанаар)."},{"t":"fact","x":"**Минаматын өвчин (Япон, 1950-иад):** ойролцоох үйлдвэр мөнгөн ус агуулсан хаягдлаа далайд хаяж, загас, хясаанд хуримтлагдсан. Тэдгээрийг идсэн хүмүүс мэдрэлийн хүнд өвчинд нэрвэгдэв. Үйлдвэр ажлын байр, орлого авчирсан ч эрүүл мэндийн хохирол хэт их байсан тул зогсоосон. Ашиг ба эрсдэлийг жинлэх сонгодог жишээ."}]}],"flashcards":[{"id":"4.3-fc1","front":"Пестицид гэж юу вэ?","back":"Таримлыг хортон шавж, хогийн ургамал, мэрэгчээс хамгаалах химийн бодис."},{"id":"4.3-fc2","front":"Пестицидийн давуу ба сул тал?","back":"Ургац нэмэгдэнэ / үлдэгдэл хүнсэнд үлдэж, агаар, ус, хөрсөөр хордуулна."},{"id":"4.3-fc3","front":"E100–E199?","back":"Будагч."},{"id":"4.3-fc4","front":"E200–E299?","back":"Хадгалалтын бодис (хугацаа уртасгагч)."},{"id":"4.3-fc5","front":"Хортой ба аюултай бодисын ялгаа?","back":"Хортой: эрүүл мэндэд хор. Аюултай: тэсрэмтгий, шатамхай, идэмхий, исэлдүүлэгч, цочроох."},{"id":"4.3-fc6","front":"Никотин ямар нөлөөтэй вэ?","back":"Хортой, донтуулдаг."},{"id":"4.3-fc7","front":"Угаарын хий яагаад аюултай вэ?","back":"Цусны хүчилтөрөгч зөөх чадварыг бууруулна."},{"id":"4.3-fc8","front":"Минаматын өвчнийг юу үүсгэсэн бэ?","back":"Үйлдвэрийн мөнгөн ус агуулсан хаягдал загасаар дамжин хүнд хуримтлагдсан."},{"id":"4.3-fc9","front":"Меламины 2008 оны хэрэг?","back":"Сүүнд хууль бусаар нэмж уураг их мэт харагдуулсан; олон хүүхэд өвдсөн."}],"quiz":[{"id":"4.3-mcq1","question":"Шошгон дээрх E211 ямар ангиллын нэмэлт вэ?","options":["Будагч","Хадгалалтын бодис","Антиоксидант","Эмульсжүүлэгч"],"answer":1,"explanation":"E200–E299 = хадгалалтын бодис."},{"id":"4.3-mcq2","question":"E102 ямар ангилал?","options":["Будагч","Амтлагч","Хадгалалтын бодис","Өтгөрүүлэгч"],"answer":0,"explanation":"E100–E199 = будагч."},{"id":"4.3-mcq3","question":"Аль нь «аюултай» (хортой биш) бодисын тодорхойлолтод тохирох вэ?","options":["Удаан хугацаанд хавдар үүсгэнэ","Шатамхай, тэсрэмтгий","Донтуулна","Хуримтлагдана"],"answer":1,"explanation":" scheme":["Шаргал/хүрэн өнгө, эвгүй үнэр","pH буурна (хүчиллэг) — утааны бодисууд усанд уусна"],"model":"Ус шаргал хүрэн болж үнэртэнэ, pH буурч хүчиллэг болно; утаанд агуулагдах давирхай, хүчиллэг бодис усанд уусна."},{"label":"б","prompt":"Энэ үр дүнг тамхи татагчийн уушгитай холбож тайлбарла.","marks":2,"scheme":["Ижил бодисууд уушгины чийглэг гадаргууд шингэж хуримтлагдана","Амьсгалын замыг цочроож, өвчин үүсгэнэ"],"model":"Уушгины чийглэг эд нь устай адил утааны бодисыг шингээж хуримтлуулна; энэ нь амьсгалын замыг цочроож, архаг өвчин үүсгэнэ."},{"label":"в","prompt":"Сургуулийн ойролцоо тамхи худалдахыг хориглосон хуулийн хоёр үндэслэлийг бич.","marks":2,"scheme":["Хүүхэд, өсвөр насныхныг эрт донтохоос хамгаалах (никотин донтуулна)","Идэвхгүй татагчийн хордлогоос хамгаалах"],"model":"Никотин донтуулдаг тул хүүхдийг эрт эхлүүлэхээс сэргийлнэ; утааны идэвхгүй хордлогыг бууруулна."}]}],"practicals":[{"id":"4.3-prac1","labActivityId":null,"title":"Тамхины хорт чанарыг илрүүлэх","ref":"Туршилт 1, х.146","aim":"Утааг усанд шингээж өөрчлөлтийг ажиглах (багшийн үзүүлэх туршилт)","steps":["Тариур бүхий бөглөөтэй хуванцар сав угсарна","Савны усыг урсгаж утааг соруулна","Сэгсэрч утааг усанд шингээнэ","Өнгө, үнэр, pH-ийг 0, 1, 7 хоногт ажиглана"],"safety":"Багш гүйцэтгэнэ; амны хаалт; галаас сэргийлэх.","result":"Ус шар хүрэн, хүчиллэг болно."}]}],"glossary":[{"term":"Атом","definition":"Химийн элементийн хамгийн жижиг хэсэг; төвдөө цөмтэй, түүнийг тойрон электронтой.","topicId":"2.1"},{"term":"Атомын цөм","definition":"Протон ба нейтроноос тогтсон, атомын төвд орших эерэг цэнэгтэй хэсэг.","topicId":"2.1"},{"term":"Протон","definition":"Цөм дэх эерэг (+1) цэнэгтэй, харьцангуй масс нь 1 эгэл хэсэг.","topicId":"2.1"},{"term":"Нейтрон","definition":"Цөм дэх цэнэггүй, харьцангуй масс нь 1 эгэл хэсэг.","topicId":"2.1"},{"term":"Электрон","definition":"Цөмийг тойрон давхраанд байрлах сөрөг (−1) цэнэгтэй, маш бага масстай эгэл хэсэг.","topicId":"2.1"},{"term":"Дэс дугаар (Z)","de **35**."},{"topicId":"2.2","noteId":"2.2d","text":"Сурах бичгийн хүснэгт 2.2.3-ын хайлах/буцлах цэгийн утга буруу хуулагдсан (жишээ нь аргоны буцлах цэг 59 °C гэж). Дээрх хүснэгтийн утгууд зөв. Мөн зураг 2.2.10-т гелийг «3 протон» гэж бичсэн, зөв нь **2 протон, 2 нейтрон**."},{"topicId":"2.3","noteId":"2.3a","text":"Сурах бичигт 1868 онд гелийг Рамзай нээсэн мэт бичсэн. 1868 онд **П. Жанссен ба Н. Локьер** нарны гэрлийн спектрээс гелийг илрүүлсэн; дэлхий дээр **Рамзай 1895** онд ялгаж авсан."},{"topicId":"2.3","noteId":"2.3b","text":"Сурах бичгийн х.65-д Менделеевийн таамагласан элементийг «44, 68, 100 дугаар элемент» гэжээ. Эдгээр нь ойролцоо **атом масс**; сканди, галли, германийн дэс дугаар 21, 31, 32."},{"topicId":"3.1","noteId":"3.1a","text":"Сурах бичгийн х.73-т энэ урвалаас «зэсийн сульфатын цэнхэр уусмал» үүснэ гэжээ. Урвалд сульфат оролцоогүй тул үүсэх нь **зэсийн нитрат**."},{"topicId":"3.2","noteId":"3.2c","text":"Сурах бичгийн зураг 3.2.12-т 1 см³ шоог 1000 хэсэгт хуваахад 6000 см² болно гэжээ. Талын урт 0.1 см болох тул нийт талбай = 1000 × 6 × 0.01 = **60 см²** (10 дахин ихсэлт). 8 хэсэгт хуваахад 12 см² (2 дахин) гэдэг нь зөв."},{"topicId":"3.2","noteId":"3.2c","text":"Сурах бичигт катализатор «мөргөлдөлтийн тоог ихэсгэнэ» гэжээ. Илүү зөв тайлбар: мөргөлдөлтийн тоо биш, **ашигтай болох мөргөлдөлтийн хувь** ихэснэ, учир нь бага энерги шаардсан өөр зам бий болно."},{"topicId":"4.3","noteId":"4.3b","text":"Сурах бичигт меламиныг «сүүний өнгийг сайжруулахаар 1 кг-д 2.5 мг хүртэл нэмэхийг зөвшөөрдөг» гэжээ. Меламин хүнсний нэмэлт **биш**; 2.5 мг/кг нь санамсаргүй бохирдлын дээд хязгаар. 2008 онд **уургийн хэмжээг хуурамчаар өсгөх** зорилгоор нэмсэн. Мөн E800–E899 «хөөс намдаагч» гэж бичсэн; хөөс намдаагч нь E900-аар эхэлдэг."}],"elements":[{"z":1,"symbol":"H","name":"Устөрөгч","mass":"1.008","category":"nm","state":"g","period":1,"group":1,"fRow":null,"config":[["1s",1]],"shells":[1],"block":"s","look":"gas","color":"#dbeeff","use":"Пуужингийн түлш, аммиак /* ---------- progress store (demo: this browser only) ---------- */
const KEY = "cq-g8hub-v1";
let P = { notes:{}, cards:{}, cx:{}, quizBest:{}, mcq:{}, marks:{}, mx:{}, rag:{}, xp:0, last:null, days:{}, log:[], hist:[], updatedAt:0, el:{}, lab:{}, ls:{}, drill:{n:0,ok:0,streak:0,best:0} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch (e) {}
let UI = { railOff:false, focus:false };
try { const u = localStorage.getItem(KEY+"-ui"); if (u) UI = Object.assign(UI, JSON.parse(u)); } catch (e) {}
function saveUI(){ try { localStorage.setItem(KEY+"-ui", JSON.stringify(UI)); } catch (e) {} }
function setFocus(on){ document.body.classList.toggle("focus", on); UI.focus=on; saveUI(); closeMenu(); }
function save(){ P.updatedAt=Date.now(); try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} renderXP(); syncLater(); }
const dayKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function dayRec(){ const k=dayKey(); return P.days[k]=P.days[k]||{m:0,xp:0,n:0}; }
function addXP(n){ P.xp += n; dayRec().xp += n; }
let lastAct=0;
/* activity log: one entry per action; repeated actions of the same kind on the same thing within 10 min are merged */
function track(type, topic, text, key){
  const now=Date.now(), day=dayRec();
  if(lastAct && now-lastAct < 5*60e3) day.m += (now-lastAct)/60000; lastAct=now; day.n++;
  const top=P.log[0];
  if(top && key && top.key===key && now-top.t < 10*60e3){ top.t=now; top.text=text; top.c=(top.c||1)+1; }
  else { P.log.unshift({t:now,type,topic,text,key}); if(P.log.length>300) P.log.length=300; }
}

/* ---------- sync to the viewer's own account (private per viewer) ---------- */
let DBREF=null, SYNC="local", syncT=null;
function mergeP(a,b){ // combine two progress records without losing work done on either device
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b, older = newer===a?b:a;
  const m = JSON.parse(JSON.stringify(newer));
  for(const k of ["notes","cx","mcq"]) m[k]=Object.assign({}, older[k]||{}, newer[k]||{});
  m.quizBest={...(older.quizBest||{})}; for(const [k,v] of Object.entries(newer.quizBest||{})) m.quizBest[k]=Math.max(v, m.quizBest[k]||0);
  for(const k of ["cards","marks","mx","rag","el","lab","ls"]) m[k]=Object.assign({}, older[k]||{}, newer[k]||{});
  m.xp=Math.max(a.xp||0,b.xp||0);
  m.days={...(older.days||{})}; for(const [k,v] of Object.entries(newer.days||{})){ const o=m.days[k]||{m:0,xp:0,n:0}; m.days[k]={m:Math.max(o.m,v.m),xp:Math.max(o.xp,v.xp),n:Math.max(o.n,v.n)}; }
  const uniq=(arr)=>{ const seen=new Set(); return arr.filter(x=>{ const k=x.t+"|"+(x.key||x.kind||""); if(seen.has(k)) return false; seen.add(k); return true; }).sort((x,y)=>y.t-x.t); };
  m.log=uniq([...(a.log||[]),...(b.log||[])]).slice(0,300); m.hist=uniq([...(a.hist||[]),...(b.hist||[])]).slice(0,100);
  return m;
}
function syncLater(){ if(!DBREF) return; clearTimeout(syncT); syncT=setTimeout(pushRemote, 1500); }
async function pushRemote(){ if(!DBREF) return; try{ await DBREF.set({ json: JSON.stringify(P), updatedAt: P.updatedAt }); SYNC="synced"; }catch(e){ SYNC = e&&e.code==="quota_exceeded" ? "full" : "error"; } renderSync(); }
function renderSync(){ const el=$("#sync"); if(el) el.innerHTML=syncText(); }
function syncText(){ return SYNC==="synced" ? `<span style="color:var(--good)">●</span> Таны бүртгэлд хадгалагдсан. Өөр төхөөрөмжөөс нээхэд үргэлжилнэ.`
  : SYNC==="syncing" ? `Бүртгэлтэй холбогдож байна…`
  : SYNC==="error" ? `<span style="color:var(--bad)">●</span> Бүртгэлд хадгалж чадсангүй; энэ хөтөчид хадгалагдсан. Дараагийн үйлдлээр дахин оролдоно.`
  : SYNC==="full" ? `<span style="color:var(--bad)">●</span> Хадгалах сан дүүрсэн; энэ хөтөчид хадгалагдсан.`
  : `<span style="color:var(--amber)">●</span> Зөвхөн энэ хөтөчид хадгалагдана (нэвтэрсэн хэрэглэгчийн ахиц бүртгэлд хадгалагдана).`; }
async function initSync(){ try{
  const use = window.claude && window.claude.use; if(!use) return;
  SYNC="syncing"; renderSync();
  const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const uid = user ? await user.id() : null;
  if(!db || !uid){ SYNC="local"; renderSync(); return; }
  DBREF = db.doc("data/users/"+uid+"/progress");
  const snap = await DBREF.get(); const d = snap.exists ? snap.data() : null;
  if(d && d.json){ const remote=JSON.parse(d.json); P = mergeP(P, remote); try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} render(); }
  await pushRemote();

const CH = Object.fromEntries(DATA.chapters.map(c => [c.id, c]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(s){
  let h = esc(s);
  h = h.replace(/\{\{nuc:(\d+):(\d+):([A-Za-z]+)\}\}/g, (m,a,z,x) => `<span class="nuc"><span class="st"><span>${a}</span><span>${z}</span></span><b>${x}</b></span>`);
  h = h.replace(/([A-Za-z\)])_(\d+)/g, "$1<sub>$2</sub>");
  h = h.replace(/\^(\d*[+\-−])/g, "<sup>$1</sup>");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  h = h.replace(/\*([^*]+?)\*/g, "<i>$1</i>");
  return h;
}
const plain = s => String(s).replace(/\{\{nuc:(\d+):(\d+):([A-Za-z]+)\}\}/g,"$3-$1").replace(/[*_^]/g,"");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }
const LV = { easy:"Хялбар", medium:"Дунд", hard:"Хүнд" };

/* ---------- progress maths ---------- */
function topicStats(t){
  const notes = t.notes.filter(n=>P.notes[n.id]).length / t.notes.length;
  const cards = t.flashcards.filter(c=>(P.cards[c.id]||0)>=2).length / t.flashcards.length;
  const quiz = (P.quizBest[t.id]||0)/100;
  const tot = t.questions.reduce((s,q)=>s+q.totalMarks,0);
  const got = t.questions.reduce((s,q)=>s+qMarks(q),0);
  const qs = tot? got/tot : 0;
  const np=t.practicals.length, lab = np ? t.practicals.filter(p=>labStage(p.id)>=4).length/np : 0;
  return { notes, cards, quiz, qs, lab, all: np ? (notes+cards+quiz+qs+lab)/5 : (notes+cards+quiz+qs)/4, got, tot };
}
function qMarks(q){ const m=P.marks[q.id]; if(!m) return 0; return q.parts.reduce((s,p,i)=>s+Math.min(p.marks,(m[i]||[]).filter(Boolean).length),0); }
const pct = x => Math.round(x*100);

function blocks(bs){ return bs.map(b=>{

    case "warn": return `<div class="box warn"><span class="lbl">Түгээмэл алдаа</span><div>${fmt(b.x)}</div></div>`;

    case "ex": { const id="ex"+Math.random().toString(36).slice(2,8); return `<div class="ex"><div class="q"><span class="eyebrow">Жишээ</span><div>${fmt(b.q)}</div></div><div class="row" style="padding:8px 14px"><button class="btn ghost" data-act="reveal" data-id="${id}">Бодолтыг харах</button></div><div class="a" id="${id}" hidden>${fmt(b.a)}</div></div>`; }
    case "fig": return `<figure class="fig"><div class="canvas" data-fig="${b.name}" data-args='${esc(JSON.stringify(b.args||{}))}'></div><figcaption>${fmt(b.cap||"")}</figcaption></figure>`;
  } return ""; }).join(""); }

/* flashcards (Leitner boxes 0–3) */
let FC = null;
function fcStart(cards, key, weakOnly){
  let deck = cards.map(c=>c.id); if(weakOnly) deck = deck.filter(id=>(P.cards[id]||0)<2);
  FC = { key, base: deck.slice(), deck, i:0, flip:false, list:false, shuf:false };
}
function fcView(cards, key){
  if(!FC || FC.key!==key) fcStart(cards, key, false);
  const byId = Object.fromEntries(cards.map(c=>[c.id,c]));

  const known = cards.filter(c=>(P.cards[c.id]||0)>=2).length;

    h+=`<div class="card" style="text-align:center;width:min(560px,100%)"><h3>Багц дууслаа</h3><p class="muted">${known} / ${cards.length} картыг мэднэ гэж тэмдэглэсэн.</p>

  }

  h+=`<div class="fc-nav"><button class="iconbtn" data-act="fc-go" data-d="-1" ${FC.i===0?"disabled":""} aria-label="Өмнөх карт">‹</button><span class="cnt">${FC.i+1} / ${FC.deck.length}</span><button class="iconbtn" data-act="fc-go" data-d="1" ${FC.i>=FC.deck.length-1?"disabled":""} aria-label="Дараах карт">›</button>
    <span class="sp"></span><button class="chip ${FC.list?"on":""}" data-act="fc-list">Бүх карт</button><button class="chip ${FC.shuf?"on":""}" data-act="fc-shuf">Холих</button><span class="small muted mono" title="Мэднэ гэж тэмдэглэсэн">✓ ${known}/${cards.length}</span></div>`;
  if(FC.list) h+=`<div class="fc-list">${FC.deck.map((id,k)=>`<button class="${k===FC.i?"cur":""}" data-act="fc-jump" data-k="${k}"><span class="n">${k+1}</span>${dot(id)}<span class="t">${esc(plain(byId[id].front))}</span></button>`).join("")}</div>`;
  h+=`<button class="fc ${FC.flip?"flip":""}" data-act="fc-flip" aria-label="Картыг эргүүлэх"><div class="fc-in">

     <div class="fc-face back"><span class="eyebrow">Хариулт</span><div>${fmt(c.back)}</div></div></div></button>
   <div class="small muted">Space — эргүүлэх · ← → — алгасах · 1 2 3 — үнэлэх</div>
   <div class="rate"><button class="btn r0" data-act="fc-rate" data-v="0" ${FC.flip?"":"disabled"}>1 · Мэдэхгүй</button><button class="btn r1" data-act="fc-rate" data-v="1" ${FC.flip?"":"disabled"}>2 · Эргэлзэж байна</button><button class="btn r2" data-act="fc-rate" data-v="2" ${FC.flip?"":"disabled"}>3 · Мэднэ</button></div></div>`;
  return h;
}
function fcGo(k){ if(!FC||k<0||k>=FC.deck.length) return; FC.i=k; FC.flip=false; render(); const c=$(".fc"); if(c) c.focus({preventScroll:true}); }
function fcRate(v){
  const id=FC.deck[FC.i]; const prev=P.cards[id]||0;
  let nb = v===0?0 : v===1?1 : Math.min(3,Math.max(2,prev+1));
  if(nb>=2 && !P.cx[id]){ P.cx[id]=1; addXP(1); }
  P.cards[id]=nb; if(v===0) FC.deck.push(id);
  { const tid=id.split("-")[0]; const kn=T[tid].flashcards.filter(c=>(P.cards[c.id]||0)>=2).length; track("card", tid, `Флэшкарт давтсан · ${tid}: ${kn}/${T[tid].flashcards.length} мэднэ`, "card:"+tid); }
  FC.i++; FC.flip=false; save(); render();
}

/* MCQ quiz */
let QZ=null;
function quizStart(qs, key, opts={}){ QZ={ key, items: qs.map(q=>({q, order:shuffle(q.options.map((_,i)=>i))})), i:0, pick:null, score:0, done:false, wrong:[], timed:opts.timed||0, start:Date.now(), byTopic:{} }; }
function quizView(t){ if(!QZ||QZ.key!=="topic:"+t.id) quizStart(t.quiz,"topic:"+t.id); return quizBody(); }
function quizBody(){
  const z=QZ;

    const p=Math.round(100*z.score/z.items.length);

    if(z.wrong.length){ h+=`<div><b>Алдсан асуултууд</b>${z.wrong.map(w=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div>${fmt(w.question)}</div><div class="small" style="color:var(--good)">Зөв: ${fmt(w.options[w.answer])}</div><div class="small muted">${fmt(w.explanation)}</div></div>`).join("")}</div>`; }
    h+=`<div class="row"><button class="btn primary" data-act="quiz-restart">Дахин өгөх</button></div></div>`;
    return h;
  }
  const it=z.items[z.i], q=it.q, answered=z.pick!==null;
  let h=`<div class="card" style="display:flex;flex-direction:column;gap:12px">
   <div class="row" style="justify-content:space-between"><span class="eyebrow">Асуулт ${z.i+1} / ${z.items.length}${q._topic?` · ${q._topic}`:""}</span>${z.timed?`<span class="timer" id="timer"></span>`:""}<span class="mono small muted">Оноо: ${z.score}</span></div>
   <div class="bar"><i style="width:${pct(z.i/z.items.length)}%"></i></div>
   <h3 style="font-family:var(--f-body);font-weight:600">${fmt(q.question)}</h3>
   <div style="display:flex;flex-direction:column;gap:8px">${it.order.map((oi,k)=>{ let cls=""; if(answered){ if(oi===q.answer) cls="right"; else if(oi===z.pick) cls="wrong"; }
     return `<button class="qopt ${cls}" data-act="quiz-pick" data-o="${oi}" ${answered?"disabled":""}><span class="L">${"АБВГ"[k]}</span><span>${fmt(q.options[oi])}</span></button>`; }).join("")}</div>`;
  if(answered){ const ok=z.pick===q.answer; h+=`<div class="feedback ${ok?"ok":"no"}"><b>${ok?"Зөв.":"Буруу."}</b> ${fmt(q.explanation)}</div><div class="row"><button class="btn primary" data-act="quiz-next">${z.i<z.items.length-1?"Дараах асуулт →":"Дүнг харах"}</button></div>`; }
  return h+`</div>`;
}
function quizPick(o){
  const z=QZ, q=z.items[z.i].q; z.pick=o; const ok=o===q.answer; if(ok) z.score++; else z.wrong.push(q);
  const tid=q._topic||q.id.split("-")[0]; z.byTopic[tid]=z.byTopic[tid]||{c:0,n:0}; z.byTopic[tid].n++; if(ok) z.byTopic[tid].c++;
  if(ok && !P.mcq[q.id]) addXP(2); if(ok) P.mcq[q.id]=1; save(); render();
}
function quizNext(){ const z=QZ; z.i++; z.pick=null; if(z.i>=z.items.length){ z.done=true; clearInterval(timerT);
  const sc=Math.round(100*z.score/z.items.length);
  if(z.key.startsWith("topic:")){ const id=z.key.slice(6); P.quizBest[id]=Math.max(P.quizBest[id]||0, sc); P.hist.unshift({t:Date.now(),kind:"topic",topic:id,score:z.score,n:z.items.length}); track("quiz", id, `${id} шалгах тест: ${z.score}/${z.items.length} (${sc}%)`); }
  else { P.hist.unshift({t:Date.now(),kind:"test",topics:Object.keys(z.byTopic),score:z.score,n:z.items.length,by:z.byTopic}); track("test", null, `Холимог тест: ${z.score}/${z.items.length} (${sc}%)`); }
  if(P.hist.length>100) P.hist.length=100; save(); }
  render(); }

/* structured questions with mark schemes */
let OPEN = {};

  const lv=S.qLevel; const qs=t.questions.filter(q=>lv==="all"||q.level===lv);
  let h=`<div class="row"><span class="small muted">Түвшин:</span>${["all","easy","medium","hard"].map(k=>`<button class="chip ${lv===k?"on":""}" data-act="qlevel" data-l="${k}">${k==="all"?"Бүгд":LV[k]}</button>`).join("")}</div>
  <p class="small muted" style="margin:0">Хариултаа бичээд «Онооны схем»-ийг нээж, өөрийн хариултад байгаа оноо бүрийг чагтлана уу. Оноо нь тухайн хэсгийн дээд онооноос хэтрэхгүй.</p>`;
  for(const q of qs){ const got=qMarks(q);
    h+=`<div class="card sq"><div class="head"><b class="mono">${q.id}</b><span class="chip lvl-${q.level}">● ${LV[q.level]}</span><span class="mono small muted" style="margin-left:auto">${got} / ${q.totalMarks} оноо</span></div><div>${fmt(q.stem)}</div>`;
    q.parts.forEach((p,i)=>{ const key=q.id+"-"+i, open=OPEN[key]; const m=(P.marks[q.id]||{})[i]||[];
      h+=`<div class="part"><div class="pp"><span class="pl">${p.label})</span><span>${fmt(p.prompt)}</span><span class="mk">[${p.marks}]</span></div>
      <textarea id="ans-${key}" placeholder="Хариултаа энд бич…" aria-label="${p.label} хэсгийн хариулт"></textarea>
      <div class="row"><button class="btn ghost" data-act="scheme" data-k="${key}">${open?"Схемийг хаах":"Онооны схем"}</button></div>`;
      if(open){ h+=`<div class="scheme"><span class="eyebrow">Онооны схем · оноо бүрийг чагтал</span>${p.scheme.map((s,j)=>`<label><input type="checkbox" data-act="mark" data-q="${q.id}" data-p="${i}" data-j="${j}" ${m[j]?"checked":""}><span>${fmt(s)}</span></label>`).join("")}
        <div class="model"><span class="eyebrow">Загвар хариулт</span><div>${fmt(p.model)}</div></div></div>`; }
      h+=`</div>`; });
    h+=`</div>`; }
  return h;
}
function tPrac(t){

/* my progress */
function streak(){ let n=0; const d=new Date(); if(!(P.days[dayKey(d)]||{}).n) d.setDate(d.getDate()-1);
  while((P.days[dayKey(d)]||{}).n){ n++; d.setDate(d.getDate()-1); } return n; }
function weekMin(){ let m=0; const d=new Date(); for(let i=0;i<7;i++){ m+=(P.days[dayKey(d)]||{}).m||0; d.setDate(d.getDate()-1); } return Math.round(m); }
function ago(t){ const s=(Date.now()-t)/1000; if(s<60) return "дөнгөж сая"; if(s<3600) return Math.floor(s/60)+" мин өмнө"; const d=new Date(t), n=new Date();
  const hm=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  if(dayKey(d)===dayKey(n)) return "Өнөөдөр "+hm; const y=new Date(); y.setDate(y.getDate()-1); if(dayKey(d)===dayKey(y)) return "Өчигдөр "+hm;
  return `${d.getMonth()+1}-р сарын ${d.getDate()}, ${hm}`; }
function nextStep(t){ const st=topicStats(t), k=t.flashcards.filter(c=>(P.cards[c.id]||0)>=2).length, r=t.objectives.filter(o=>P.rag[o.id]==="r").length;
  if(st.notes<1) return ["notes",`Тэмдэглэл: ${t.notes.filter(n=>P.notes[n.id]).length}/${t.notes.length} уншсан. Үлдсэнийг уншаарай.`];
  if(st.cards<.8) return ["cards",`Флэшкарт: ${k}/${t.flashcards.length} мэднэ. «Мэдэхгүй» картуудаа давтаарай.`];
  if(st.quiz<.8) return ["quiz", P.quizBest[t.id]?`Шалгах тест: шилдэг дүн ${P.quizBest[t.id]}%. 80%-д хүргээрэй.`:`Шалгах тестээ өгөөгүй байна.`];
  if(st.qs<.8) return ["questions",`Сэдвийн асуулт: ${st.got}/${st.tot} оноо. Онооны схемээр өөрийгөө шалгаарай.`];

}
function dkRate(v){ P.ls=P.ls||{}; const id=DK.ids[DK.i], prev=P.ls[id]||0; const nb=v===0?0:v===1?1:Math.min(3,Math.max(2,prev+1)); if(nb>=2&&!P.cx["ls"+id]){ P.cx["ls"+id]=1; addXP(1); }
  P.ls[id]=nb; if(v===0) DK.ids.push(id); track("ls", null, `Лабораторийн карт давтсан`, "ls"); DK.i++; DK.flip=false; save(); render(); }

/* reading drills */
let DR=null;
const DRT={ cylinder:"Хэмжээст цилиндр", thermometer:"Термометр", burette:"Бюретка" };
function drNew(type){
  type = type || (DR&&DR.fixed) || ["cylinder","thermometer","burette"][Math.floor(Math.random()*3)];
  let v, step, tol, dp, unit;
  if(type==="cylinder"){ const opt=[[0.2,10],[0.5,25],[1,100]][Math.floor(Math.random()*3)]; step=opt[0]; const n=Math.round((opt[1]*0.15+Math.random()*opt[1]*0.7)/step); v=+(n*step).toFixed(1); tol=step/2; dp=step<1?1:0; unit="см³"; }
  else if(type==="thermometer"){ step=1; v=Math.round((Math.random()*90-5)*2)/2; tol=0.5; dp=1; unit="°C"; }
  else { step=0.1; v=Math.round((0.5+Math.random()*48)*20)/20; tol=0.05; dp=2; unit="см³"; }
  DR={ type, v, step, tol, dp, unit, ans:"", res:null, fixed:DR&&DR.fixed };
}
function drSVG(){
  const {type,v,step}=DR, down=type==="burette", major=type==="thermometer"?5:(step===0.2?1:step===0.5?5:step===1?5:1);
  const span=type==="burette"?8:type==="thermometer"?7:8; const lo=v-span*step, hi=v+span*step; const top=14, bot=246, k=(bot-top)/(hi-lo), y=x=>down? top+(x-lo)*k : bot-(x-lo)*k;
  let g=`<rect x="70" y="${top}" width="80" height="${bot-top}" style="fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5"/>`;
  if(type==="thermometer"){ g+=`<rect x="104" y="${y(v)}" width="12" height="${bot-y(v)}" style="fill:#d0453a"/>`; }
  else { g+=`<rect x="71" y="${y(v)-7}" width="78" height="${bot-y(v)+7}" style="fill:var(--accent-soft)"/><path d="M71 ${y(v)-7} Q110 ${y(v)+7} 149 ${y(v)-7}" style="fill:var(--accent-soft);stroke:var(--accent);stroke-width:2"/>`; }
  const first=Math.ceil(lo/step-1e-9);
  for(let n=first; n*step<=hi+1e-9; n++){ const x=+(n*step).toFixed(2), yy=y(x); if(yy<top||yy>bot) continue; const isMaj=Math.abs(x/major-Math.round(x/major))<1e-6, isMid=!isMaj&&type!=="thermometer"&&step===0.1&&Math.abs(x*2-Math.round(x*2))<1e-6;
    g+=`<line x1="70" y1="${yy}" x2="${70+(isMaj?26:isMid?18:12)}" y2="${yy}" style="stroke:var(--ink);stroke-width:${isMaj?1.6:1}"/>`;
    if(isMaj) g+=`<text x="62" y="${yy+4}" text-anchor="end" style="fill:var(--ink);font:600 12px var(--f-mono)">${+x.toFixed(2)}</text>`; }
  g+=`<line x1="150" y1="${y(v)}" x2="186" y2="${y(v)}" style="stroke:var(--ink-3);stroke-dasharray:3 3"/><circle cx="194" cy="${y(v)}" r="7" style="fill:var(--surface);stroke:var(--ink-3)"/><circle cx="191" cy="${y(v)}" r="2.6" style="fill:var(--ink-2)"/>`;
  return `<svg viewBox="0 0 210 260" width="230" role="img" aria-label="${DRT[type]}-ийн хуваарь">${g}</svg>`;
}
function drView(){
  if(!DR) drNew(); const st=P.drill||{n:0,ok:0,streak:0,best:0};
  const hintTxt={ cylinder:`Нэг жижиг хуваарь = ${DR.step} ${DR.unit}. Менискийн доод цэгийг унш.`, thermometer:"Нэг хуваарь = 1 °C. Шингэний баганын оройг 0.5 °C нарийвчлалтай унш.", burette:"Бюреткийн тоо ДООШОО ихэсдэг. Нэг хуваарь = 0.10 см³; 2 оронтой (жишээ 23.45) бич." }[DR.type];
  let fb=""; if(DR.res){ fb = DR.res.ok ? `<div class="feedback ok"><b>Зөв.</b> ${DR.v.toFixed(DR.dp)} ${DR.unit}${DR.res.dpWarn?` · ${DR.res.dpWarn}`:""}</div>` : `<div class="feedback no"><b>Буруу.</b> Зөв хариу: ${DR.v.toFixed(DR.dp)} ${DR.unit}. ${hintTxt}</div>`; }
  return `<div class="row"><span class="small muted">Багаж:</span>${[["","Холимог"],...Object.entries(DRT)].map(([k,l])=>`<button class="chip ${(DR.fixed||"")===k?"on":""}" data-act="dr-type" data-v="${k}">${l}</button>`).join("")}<span class="sp" style="flex:1"></span><span class="small muted mono">Зөв ${st.ok}/${st.n} · цуваа ${st.streak} (дээд ${st.best})</span></div>
    <div class="drill"><div>${drSVG()}</div><div class="fl" style="max-width:300px"><div class="eyebrow">${DRT[DR.type]}</div><b>Заалтыг унш</b><span class="small muted">${hintTxt}</span>
      <form class="row" data-form="dr" onsubmit="return false"><input id="dr-in" class="cellin" style="width:120px" inputmode="decimal" value="${esc(DR.ans)}" ${DR.res?"disabled":""} aria-label="Заалт"><span>${DR.unit}</span>${DR.res?`<button class="btn primary" type="button" data-act="dr-next">Дараагийнх →</button>`:`<button class="btn primary" type="button" data-act="dr-check">Шалгах</button>`}</form>${fb}</div></div>`;

function drCheck(){
  const inp=$("#dr-in"); const raw=(inp?inp.value:"").trim().replace(",","."); DR.ans=raw; const a=parseFloat(raw); if(isNaN(a)){ toast("Тоо оруулна уу."); return; }
  const ok=Math.abs(a-DR.v)<=DR.tol+1e-9; const dps=(raw.split(".")[1]||"").length; const dpWarn = ok && dps<DR.dp ? `${DR.dp} оронтой бичвэл илүү зөв (${DR.v.toFixed(DR.dp)}).` : "";
  DR.res={ok,dpWarn}; const st=P.drill=P.drill||{n:0,ok:0,streak:0,best:0}; st.n++; if(ok){ st.ok++; st.streak++; st.best=Math.max(st.best,st.streak); if(st.streak%5===0) addXP(2); } else st.streak=0;

/* search */
let SQ="";
function vSearch(){
  const q=SQ.trim().toLowerCase(); if(q.length<2) return `<h1>Хайлт</h1><p class="muted">Дор хаяж 2 тэмдэгт оруулна уу.</p>`;
  const hl = s => fmt(s).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
  const res=[];
  for(const t of DATA.topics){
    if(t.title.toLowerCase().includes(q)) res.push({k:"Сэдэв",t,ni:0,title:t.id+" "+t.title,snip:""});
    t.notes.forEach((n,ni)=>{ const txt=n.blocks.map(b=>[b.x,b.q,b.a,b.term,...(b.items||[]),...((b.rows||[]).flat()),b.cap].filter(Boolean).join(" ")).join(" ");
      const p=plain(txt), i=p.toLowerCase().indexOf(q); if(i>=0||n.title.toLowerCase().includes(q)) res.push({k:"Тэмдэглэл",t,ni,title:n.title,snip:i>=0?"…"+p.slice(Math.max(0,i-60),i+90)+"…":""}); });
    t.flashcards.forEach(c=>{ if(plain(c.front+" "+c.back).toLowerCase().includes(q)) res.push({k:"Флэшкарт",t,ni:-1,tab:"cards",title:c.front,snip:c.back}); });
  }
  DATA.glossary.forEach(g=>{ if((g.term+" "+g.definition).toLowerCase().includes(q)) res.push({k:"Нэр томьёо",t:T[g.topicId],ni:0,title:g.term,snip:g.definition}); });
  return `<div><div class="eyebrow">Хайлт</div><h1>«${esc(SQ)}» · ${res.length} илэрц</h1></div><div class="card" style="padding:6px">${res.slice(0,60).map(r=>`<button class="res" data-act="topic" data-id="${r.t.id}" ${r.ni>=0?`data-ni="${r.ni}"`:""} ${r.tab?`data-tab="${r.tab}"`:""}><span class="eyebrow">${r.k} · ${r.t.id}</span><b>${hl(r.title)}</b>${r.snip?`<span class="small muted">${hl(r.snip)}</span>`:""}</button>`).join("")||`<p class="muted" style="padding:10px">Илэрц олдсонгүй.</p>`}</div>`;
}

function shells(z){ return DATA.elements[z-1].shells; }
function neutrons(e){ const m=e.mass.replace(/[\[\]]/g,""); return Math.round(parseFloat(m))-e.z; }
function bohrSVG(z, size, bare){
  size=size||260; const e=DATA.elements[z-1], sh=e.shells, n=sh.length, c=150;
  const step = n<=4 ? 25 : 98/n, R=sh.map((_,i)=>44+i*step+ (n<=4?0:step*0.4));
  let g="";
  sh.forEach((k,i)=>{ g+=`<circle cx="${c}" cy="${c}" r="${R[i].toFixed(1)}" style="fill:none;stroke:var(--line);stroke-width:1.6"/>`;
    const dr = n<=4 ? 6 : Math.max(2.2, Math.min(5, Math.PI*R[i]/Math.max(k,1)/1.6));
    for(let j=0;j<k;j++){ const a=-Math.PI/2+2*Math.PI*j/k; g+=`<circle cx="${(c+R[i]*Math.cos(a)).toFixed(1)}" cy="${(c+R[i]*Math.sin(a)).toFixed(1)}" r="${dr.toFixed(1)}" style="fill:var(--accent)"/>`; } });
  const lab = bare ? "" : `<text x="${c}" y="${c-3}" text-anchor="middle" style="fill:var(--ink);font:600 12px var(--f-mono)">${z}p⁺</text><text x="${c}" y="${c+12}" text-anchor="middle" style="fill:var(--ink-2);font:500 11px var(--f-mono)">${neutrons(e)}n</text>`;
  return `<svg viewBox="0 0 300 300" width="${size}" height="${size}" style="max-width:100%;height:auto" role="img" aria-label="${esc(e.name)}: электроны давхраа ${sh.join(", ")}">${g}<circle cx="${c}" cy="${c}" r="28" style="fill:var(--flame-soft);stroke:var(--flame);stroke-width:1.6"/>${lab}</svg>`;
}
const SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const sup=n=>String(n).split("").map(d=>SUP[d]).join("");
function cfgFull(e){ return e.config.map(([k,v])=>k+sup(v)).join(" "); }
function cfgShort(e){ const core=[86,54,36,18,10,2].find(x=>x<e.z); if(!core) return cfgFull(e);
  const cc=new Map(DATA.elements[core-1].config.map(([k,v])=>[k,v])); const rest=e.config.filter(([k,v])=>cc.get(k)!==v);
  return `[${DATA.elements[core-1].symbol}] `+rest.map(([k,v])=>k+sup(v)).join(" "); }
const FAMILY={1:"Шүлтийн металлууд",2:"Шүлт шороон металлууд",13:"Борын бүлэг",14:"Нүүрстөрөгчийн бүлэг",15:"Азотын бүлэг",16:"Хүчилтөрөгчийн бүлэг (халькоген)",17:"Галогенууд",18:"Инерт хий"};

function shade(hex,f){ const n=parseInt(hex.slice(1),16); const ch=[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(f>1? v+(255-v)*(f-1) : v*f)))); return `rgb(${ch.join(",")})`; }

const CAPTION={gas:"Хий (20 °C)",glow:"Хий; цахилгаан гүйдэлд ингэж гэрэлтэнэ",liquid:"Шингэн (20 °C)",metal:"Металл",oil:"Зөөлөн металл; керосин дотор хадгална",powder:"Хатуу, нунтаг",lumps:"Хатуу",crystal:"Хатуу талст",radio:"Цацраг идэвхт металл",radgas:"Цацраг идэвхт хий",synth:"Зохиомол; хэдхэн атом л гарган авсан"};
function cube(x,y,s,c){ const h=s*0.45; return `<polygon points="${x},${y+h} ${x+s},${y} ${x+2*s},${y+h} ${x+s},${y+2*h}" style="fill:${shade(c,1.28)}"/><polygon points="${x},${y+h} ${x+s},${y+2*h} ${x+s},${y+2*h+s*1.1} ${x},${y+h+s*1.1}" style="fill:${c}"/><polygon points="${x+s},${y+2*h} ${x+2*s},${y+h} ${x+2*s},${y+h+s*1.1} ${x+s},${y+2*h+s*1.1}" style="fill:${shade(c,.72)}"/><line x1="${x+s*0.3}" y1="${y+h+s*0.25}" x2="${x+s*0.3}" y2="${y+h+s*0.8}" style="stroke:${shade(c,1.6)};stroke-width:3;stroke-linecap:round;opacity:.8"/>`; }
function trefoil(x,y,r){ let p=""; for(let i=0;i<3;i++){ const a0=-Math.PI/2+i*2*Math.PI/3-Math.PI/6, a1=a0+Math.PI/3; p+=`<path d="M${x} ${y} L${(x+r*Math.cos(a0)).toFixed(1)} ${(y+r*Math.sin(a0)).toFixed(1)} A${r} ${r} 0 0 1 ${(x+r*Math.cos(a1)).toFixed(1)} ${(y+r*Math.sin(a1)).toFixed(1)} Z" style="fill:#1c1c1c"/>`; }
  return `<circle cx="${x}" cy="${y}" r="${r+3}" style="fill:#f5c518"/>${p}<circle cx="${x}" cy="${y}" r="${r*0.28}" style="fill:#f5c518"/><circle cx="${x}" cy="${y}" r="${r*0.18}" style="fill:#1c1c1c"/>`; }

    g+=`<path d="M54 ${hg?96:84} ${hg?"Q100 86 146 96":"L146 84"} L146 142 Q146 150 138 150 L62 150 Q54 150 54 142 Z" style="fill:${hg?`url(#${id})`:c}"/>`;
    if(!hg) g+=`<ellipse cx="100" cy="64" rx="40" ry="12" style="fill:${c};opacity:.22"/><ellipse cx="96" cy="46" rx="26" ry="9" style="fill:${c};opacity:.14"/>`;

  else if(e.look==="powder"){ g+=`<ellipse cx="100" cy="138" rx="74" ry="13" style="fill:var(--sunk);stroke:${ln};stroke-width:1.5"/><path d="M42 136 Q70 70 100 66 Q132 70 158 136 Z" style="fill:${c}"/>`;
    for(let i=0;i<26;i++){ const x=58+(i*37)%84, y=88+(i*23)%44; if(y>140-Math.abs(x-100)*0.2) continue; g+=`<circle cx="${x}" cy="${y}" r="1.6" style="fill:${shade(c,i%2?1.45:.7)}"/>`; } }

function miniPT(z, labels, big){
  const e0=DATA.elements[z-1], c=big?19:15, gp=2, ox=labels?18:0, oy=labels?16:0; let h="";
  const same=e=> e0.group && (e.group===e0.group || (e.period===e0.period && e.group));
  if(labels){ for(let k=1;k<=18;k++){ const on=k===e0.group; h+=`<text x="${ox+(k-1)*(c+gp)+c/2}" y="11" text-anchor="middle" style="fill:${on?"var(--accent)":"var(--ink-3)"};font:${on?700:500} ${big?9:7}px var(--f-mono)">${k}</text>`; }
    for(let p=1;p<=7;p++){ const on=p===e0.period; h+=`<text x="8" y="${oy+(p-1)*(c+gp)+c/2+3}" text-anchor="middle" style="fill:${on?"var(--accent)":"var(--ink-3)"};font:${on?700:500} ${big?10:8}px var(--f-mono)">${p}</text>`; } }
  DATA.elements.forEach(e=>{ let col,row; if(e.group){ col=e.group-1; row=e.period-1; } else { const list=DATA.elements.filter(x=>x.fRow===e.fRow); col=2+list.indexOf(e); row=e.fRow==="ln"?7.5:8.5; }
    const on=e.z===z, hl=!on && big && same(e);
    h+=`<rect x="${ox+col*(c+gp)}" y="${oy+row*(c+gp)}" width="${c}" height="${c}" rx="3" style="fill:${on?"var(--accent)":hl?"var(--accent-soft)":"var(--sunk)"};stroke:${on?"var(--accent)":hl?"var(--accent)":"var(--line)"};stroke-width:${hl?.6:1}"/>`;
    if(on&&big) h+=`<text x="${ox+col*(c+gp)+c/2}" y="${oy+row*(c+gp)+c/2+3.5}" text-anchor="middle" style="fill:var(--on-accent);font:700 9px var(--f-body)">${e.symbol}</text>`; });
  const W=ox+18*(c+gp), H=oy+9.5*(c+gp);
  return `<svg class="minipt" viewBox="0 0 ${W} ${H}" width="${Math.round(W*(big?1.15:1.25))}" role="img" aria-label="Үелэх хүснэгт дэх байрлал: ${e0.period}-р үе, ${e0.group||"f"}-р бүлэг">${h}</svg>`;
}
function posLines(e){
  const L=[]; const v=valence(e), main=GROMAN[e.group];
  L.push(`<b>${e.period}-р үе</b> (${e.period}-р мөр)${e.shells.length===e.period?` → <b>${e.period}</b> электрон давхраа`:""}`);
  if(e.fRow) L.push(`<b>${e.fRow==="ln"?"Лантаноидын":"Актиноидын"} мөр</b> → 3-р бүлгийн доор тусад нь байрлуулдаг`);
  else if(main) L.push(`<b>${main} бүлэг</b> (${e.group}-р багана) → гадаад давхраанд <b>${v}</b> электрон${e.z===2?" (гели ганц 2 электронтой ч инерт хий тул VIII бүлэгт)":""}`);
  else L.push(`<b>${e.group}-р бүлэг</b> → шилжилтийн металлын хэсэг`);
  if(e.z===1) L.push(`Устөрөгч I бүлэгт байрлах ч <b>металл биш</b>; шүлтийн металлын гэр бүлд ордоггүй`); else if(FAMILY[e.group]) L.push(`Гэр бүл: <b>${FAMILY[e.group]}</b>`);
  L.push(`${CAT[e.category]} · 20 °C-т ${STATE[e.state].toLowerCase()}`);
  return `<ul class="pos-lines">${L.map(x=>`<li>${x}</li>`).join("")}</ul>`;
}

/* ---------- events ---------- */
function closeMenu(){ $("#rail").classList.remove("open"); $("#scrim").classList.remove("open"); }
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const d=b.dataset, a=d.act;
  if(a==="menu"){ if(innerWidth>900){ document.body.classList.toggle("rail-off"); UI.railOff=document.body.classList.contains("rail-off"); saveUI(); } else { $("#rail").classList.toggle("open"); $("#scrim").classList.toggle("open"); } return; }
  if(a==="focus"){ setFocus(!document.body.classList.contains("focus")); return; }
  if(a==="fc-go"){ fcGo(FC.i+(+d.d)); return; }
  if(a==="fc-jump"){ FC.list=false; fcGo(+d.k); return; }
  if(a==="fc-list"){ FC.list=!FC.list; render(); return; }
  if(a==="fc-shuf"){ const cur=FC.deck[FC.i]; FC.shuf=!FC.shuf; FC.deck = FC.shuf? shuffle(FC.base) : FC.base.slice(); FC.i=Math.max(0,FC.deck.indexOf(cur)); FC.flip=false; render(); return; }
  if(a==="go") return go({view:d.view});
  if(a==="tables") return d.t==="pt" ? go({view:"periodic",pt:"table"}) : go({view:"tables",tbl:"ref"});
  if(a==="periodic") return go({view:"periodic",pt:d.t});
  if(a==="labgo"||a==="labtab"){ DK=null; return go({view:"lab",labt:d.t}); }
  if(a==="prac-goto"){ const p=PRAC[d.id]; OPENP=p.id; if(S.topic!==p.topic){ QZ=null; FC=null; } return go({view:"topic",topic:p.topic,tab:"prac"}); }
  if(a==="prac-open"){ OPENP = OPENP===d.id?null:d.id; render(); return; }
  if(a==="prac-step"){ labRec(d.id).view=+d.s; render(); return; }
  if(a==="lab-var"){ const r=labRec(d.p); r.vars=r.vars||{}; r.vars[d.i]=d.v; r.varsChecked=false; save(); render(); return; }
  if(a==="lab-varcheck"){ const r=labRec(d.p), def=LAB.structured[d.p]; r.varsChecked=true; r.varsOk=def.vars.every(([,c],i)=>(r.vars||{})[i]===c); save(); render(); return; }
  if(a==="lab-safe"){ labRec(d.p).safeAns=+d.o; save(); render(); return; }
  if(a==="lab-next"){ const r=labRec(d.p), m={prep:["s1",1],lab:["s2",2],data:["s3",3]}[d.k]; r[m[0]]=true; r.view=m[1]; track("lab", PRAC[d.p].topic, `Туршилт: ${PRAC[d.p].title} — ${STEPS[m[1]-1]} дууссан`, "lab:"+d.p); save(); render(); return; }
  if(a==="lab-open"){ const r=labRec(d.p); r.s2=true; r.view=2; save(); toast("Интеграцийн үед ChemQuest лабораторийн тухайн туршилт нээгдэнэ. Хийж дуусаад энд буцаж ирээд үр дүнгээ оруулна уу."); render(); return; }
  if(a==="lab-sample"){ const r=labRec(d.p); r.data=JSON.parse(JSON.stringify(LAB.structured[d.p].table.sample)); r.sample=true; r.s2=true; r.view=2; r.checked=false; save(); render(); return; }
  if(a==="lab-check"){ labRec(d.p).checked=true; save(); render(); return; }
  if(a==="lab-scheme"){ labRec(d.p).showScheme=true; save(); render(); return; }
  if(a==="lab-finish"){ const r=labRec(d.p); if(!r.done){ r.done=true; addXP(10); track("lab", PRAC[d.p].topic, `Туршилт дууссан: ${PRAC[d.p].title}`, "lab:"+d.p); } save(); render(); toast("Туршилт дууслаа. +10 XP"); return; }
  if(a==="dk-flip"){ DK.flip=!DK.flip; render(); return; }
  if(a==="dk-rate") return dkRate(+d.v);
  if(a==="dk-go"){ const k=DK.i+(+d.d); if(k>=0&&k<DK.ids.length){ DK.i=k; DK.flip=false; render(); } return; }
  if(a==="dk-jump"){ DK.i=+d.k; DK.flip=false; DK.list=false; render(); return; }
  if(a==="dk-list"){ DK.list=!DK.list; render(); return; }
  if(a==="dk-restart"){ DK=null; render(); return; }
  if(a==="dr-type"){ DR=DR||{}; DR.fixed=d.v||null; drNew(d.v||null); render(); return; }
  if(a==="dr-check"){ drCheck(); return; }
  if(a==="dr-next"){ drNew(); render(); setTimeout(()=>{ const i=$("#dr-in"); if(i) i.focus(); },0); return; }
  if(a==="ec-scope"){ EC.scope=d.v; UI.ecScope=d.v; saveUI(); ecStart(); render(); return; }
  if(a==="ec-mode"){ EC.mode=d.v; UI.ecMode=d.v; saveUI(); ecStart(); render(); return; }
  if(a==="ec-hint"){ EC.hint=true; render(); return; }
  if(a==="ec-flip"){ EC.flip=!EC.flip; render(); return; }
  if(a==="level"){ UI.level=d.v; saveUI(); if(EC){ if(EC.mode==="cfg"&&d.v!=="high") EC.mode="sym"; ecStart(); } render(); return; }
  if(a==="ec-rate") return ecRate(+d.v);
  if(a==="ec-go"){ ecGo(EC.i+(+d.d)); return; }
  if(a==="ec-jump"){ EC.list=false; ecGo(+d.k); return; }
  if(a==="ec-list"){ EC.list=!EC.list; render(); return; }
  if(a==="ec-shuf"){ EC.shuf=!EC.shuf; ecStart(); render(); return; }
  if(a==="ec-weak"){ EC.weak=!EC.weak; ecStart(); render(); return; }
  if(a==="ec-restart"){ ecStart(); render(); return; }
  if(a==="map-el"){ const z=+d.z; if(!EC) ecStart(); EC.scope="all"; if(EC.mode==="bohr") EC.mode="sym"; EC.weak=false; EC.shuf=false; ecStart(); EC.i=Math.max(0,EC.deck.indexOf(z)); return go({view:"periodic",pt:"cards"}); }
  if(a==="jump"){ const el=document.getElementById("rt-"+d.id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(a==="topic"){ const t=T[d.id]; let ni=0; if(d.ni) ni=+d.ni; if(d.note) ni=Math.max(0,t.notes.findIndex(n=>n.id===d.note));
    if(S.topic!==d.id){ QZ=null; FC=null; } return go({view:"topic",topic:d.id,tab:d.tab||"notes",note:ni}); }
  if(a==="tab"){ return go({tab:d.tab}); }
  if(a==="note"){ S.note=+d.i; render(); window.scrollTo(0,0); return; }
  if(a==="read"){ if(!P.notes[d.id]){ const t=T[S.topic], n=t.notes.find(x=>x.id===d.id); P.notes[d.id]=1; addXP(5); track("note", t.id, `Тэмдэглэл уншсан: ${n.title}`); save(); } render(); return; }
  if(a==="reveal"){ const el=document.getElementById(d.id); el.hidden=!el.hidden; b.textContent=el.hidden?"Бодолтыг харах":"Бодолтыг нуух"; return; }
  if(a==="fc-flip"){ FC.flip=!FC.flip; b.classList.toggle("flip",FC.flip); document.querySelectorAll('[data-act="fc-rate"]').forEach(x=>x.disabled=!FC.flip); return; }
  if(a==="fc-rate") return fcRate(+d.v);
  if(a==="fc-restart"){ const cards = S.view==="review"?DATA.topics.flatMap(t=>t.flashcards):T[S.topic].flashcards; fcStart(cards, FC.key, !!d.weak); render(); return; }
  if(a==="quiz-pick") return quizPick(+d.o);
  if(a==="quiz-next") return quizNext();
  if(a==="quiz-restart"){ if(QZ.key==="test"){ QZ=null; render(); } else { quizStart(T[S.topic].quiz,"topic:"+S.topic); render(); } return; }
  if(a==="qlevel"){ S.qLevel=d.l; render(); return; }
  if(a==="scheme"){ OPEN[d.k]=!OPEN[d.k]; const ans={}; document.querySelectorAll("textarea[id^=ans-]").forEach(t=>ans[t.id]=t.value); render(); Object.entries(ans).forEach(([id,v])=>{ const t=document.getElementById(id); if(t) t.value=v; }); return; }
  if(a==="rag"){ P.rag[d.id] = P.rag[d.id]===d.v? undefined : d.v; const tid=d.id.split("-")[0]; track("rag", tid, `Зорилтоо үнэлсэн (${tid})`, "rag:"+tid); save(); render(); return; }
  if(a==="reset-ask"){ $("#reset-confirm").hidden=false; return; }
  if(a==="reset-no"){ $("#reset-confirm").hidden=true; return; }
  if(a==="reset-yes"){ P={ notes:{}, cards:{}, cx:{}, quizBest:{}, mcq:{}, marks:{}, mx:{}, rag:{}, xp:0, last:null, days:{}, log:[], hist:[], updatedAt:0, el:{}, lab:{}, ls:{}, drill:{n:0,ok:0,streak:0,best:0} }; QZ=null; FC=null; EC=null; DK=null; DR=null; save(); toast("Ахицыг тэглэлээ."); render(); return; }
  if(a==="lab"){ toast("Интеграцийн үед энэ товч ChemQuest-ийн тухайн лабораторийн дасгал руу (labActivityId) шилжинэ."); return; }
  if(a==="tb-topic"){ TB.sel.has(d.id)?TB.sel.delete(d.id):TB.sel.add(d.id); render(); return; }
  if(a==="tb-n"){ TB.n=+d.n; render(); return; }
  if(a==="tb-start") return tbStart();
  if(a==="test-exit"){ QZ=null; clearInterval(timerT); render(); return; }
});
document.addEventListener("change", e=>{
  const d=e.target.dataset;
  if(d.act==="mark"){ const m=P.marks[d.q]=P.marks[d.q]||{}; const arr=m[d.p]=m[d.p]||[]; const q=DATA.topics.flatMap(t=>t.questions).find(x=>x.id===d.q);
    arr[+d.j]=e.target.checked; const after=qMarks(q); track("marks", d.q.split("-")[0], `Асуулт ${d.q}: ${after}/${q.totalMarks} оноо`, "marks:"+d.q); const mx=P.mx[q.id]||0; if(after>mx){ addXP(after-mx); P.mx[q.id]=after; } save();
    const head=e.target.closest(".sq").querySelector(".head .mono.small"); if(head) head.textContent=`${after} / ${q.totalMarks} оноо`; renderRail(); }
  if(d.act==="tb-timed"){ TB.timed=e.target.checked; }
  if(d.act==="lab-safetick"){ labRec(d.p).safeOk=e.target.checked; save(); render(); }
  if(d.act==="lab-mark"){ const r=labRec(d.p); r.marks=r.marks||[]; r.marks[+d.j]=e.target.checked; save(); }
  if(d.act==="lab-text"){ save(); }
  if(d.act==="res"){ resInput(e.target); save(); }
  if(e.target.id==="ec-scope-sel"){ EC.scope=e.target.value; UI.ecScope=EC.scope; saveUI(); ecStart(); render(); }
  if(e.target.id==="ec-mode-sel"){ EC.mode=e.target.value; UI.ecMode=EC.mode; saveUI(); ecStart(); render(); }
});
function resInput(t){ const d=t.dataset, r=labRec(d.p), def=LAB.structured[d.p]; r.data=r.data||[]; const v=t.value;
  if(def.table.x){ r.data[+d.c]=r.data[+d.c]||[]; r.data[+d.c][+d.r]=v; } else { r.data[+d.r]=r.data[+d.r]||[]; r.data[+d.r][+d.c]=v; }
  r.checked=false; r.sample=false; const ch=document.getElementById("chart-"+d.p); if(ch) ch.innerHTML=resChart(def, r.data);
  const dv=document.getElementById(`der-${d.p}-${d.r}`); if(dv) dv.textContent=derived(r.data,+d.r);
  const nx=document.querySelector(`[data-act="lab-next"][data-p="${d.p}"][data-k="data"]`); if(nx) nx.disabled=true; document.querySelectorAll(".checks").forEach(x=>x.remove()); }
function labTextReady(id){ const r=labRec(id), def=LAB.structured[id];
  const b1=document.querySelector(`[data-act="lab-next"][data-p="${id}"][data-k="prep"]`); if(b1) b1.disabled=!((r.pred||"").trim().length>2 && (def ? r.varsOk && r.safeAns===def.safety.a : r.safeOk));
  const b2=document.querySelector(`[data-act="lab-next"][data-p="${id}"][data-k="data"]`); if(b2&&!def) b2.disabled=!((r.obs||"").trim().length>2);
  const b3=document.querySelector(`[data-act="lab-scheme"][data-p="${id}"]`); if(b3) b3.disabled=!((r.concl||"").trim().length>2); }
document.addEventListener("input", e=>{
  if(e.target.dataset.act==="lab-text"){ const d=e.target.dataset; labRec(d.p)[d.k]=e.target.value; labTextReady(d.p); P.updatedAt=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(x){} syncLater(); return; }
  if(e.target.dataset.act==="res" && e.target.tagName==="INPUT"){ resInput(e.target); try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(x){} syncLater(); return; }
  if(e.target.id==="q"){ SQ=e.target.value; if(SQ.trim().length>=2){ S.view="search"; renderRail(); $("#main").innerHTML=`<div class="wrap">${vSearch()}</div>`; } else if(S.view==="search"){ go({view:"home"}); } }
  if(e.target.dataset.act==="gq"){ GQ=e.target.value; const pos=e.target.selectionStart; render(); const g=$("#gq"); g.focus(); g.setSelectionRange(pos,pos); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && document.body.classList.contains("focus")){ setFocus(false); return; }
  if(e.key==="Enter" && document.activeElement && document.activeElement.id==="dr-in"){ e.preventDefault(); if(DR&&!DR.res) drCheck(); return; }
  if(e.key==="Enter" && DR && DR.res && S.view==="lab" && S.labt==="read" && document.activeElement.tagName!=="BUTTON"){ drNew(); render(); setTimeout(()=>{ const i=$("#dr-in"); if(i) i.focus(); },0); return; }
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  if(DK && S.view==="lab" && ["gear","obs","haz"].includes(S.labt)){
    if(e.code==="Space"){ e.preventDefault(); DK.flip=!DK.flip; render(); return; }
    if(DK.flip && ["Digit1","Digit2","Digit3"].includes(e.code)) return dkRate(+e.code.slice(-1)-1);
    if(e.key==="ArrowRight"&&DK.i<DK.ids.length-1){ DK.i++; DK.flip=false; render(); return; } if(e.key==="ArrowLeft"&&DK.i>0){ DK.i--; DK.flip=false; render(); return; }
  }
  if(EC && S.view==="periodic" && S.pt==="cards"){
    if(e.code==="Space"){ e.preventDefault(); EC.flip=!EC.flip; render(); return; }
    if(EC.flip && ["Digit1","Digit2","Digit3"].includes(e.code)) return ecRate(+e.code.slice(-1)-1);
    if(e.key==="ArrowRight") return ecGo(EC.i+1); if(e.key==="ArrowLeft") return ecGo(EC.i-1);
  }
  if(FC && ((S.view==="topic"&&S.tab==="cards")||S.view==="review")){
    if(e.code==="Space"){ e.preventDefault(); const c=$(".fc"); if(c) c.click(); }
    if(FC.flip && ["Digit1","Digit2","Digit3"].includes(e.code)) fcRate(+e.code.slice(-1)-1);
    if(e.key==="ArrowRight") fcGo(FC.i+1); if(e.key==="ArrowLeft") fcGo(FC.i-1);
  }
});

document.body.classList.toggle("rail-off", !!UI.railOff); document.body.classList.toggle("focus", !!UI.focus);
fromHash(); render(); initSync();
</script>
